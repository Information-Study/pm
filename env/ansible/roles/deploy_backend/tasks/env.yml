---
# shared/.env 一律用 **template** 產生，不用 lineinfile 也不用 sed。
# 理由：密碼可能含 & | * ? $ / 空白等字元，sed 的替換字串會把 & 當成
# 「整段比對到的內容」、把 / 當成分隔符，lineinfile 的 regexp 也會被元字元污染，
# 兩者都會靜靜寫出一個錯的密碼。template 是純字串替換，沒有這個問題。

- name: Env | 讀取 shared/.env 是否已存在
  ansible.builtin.stat:
    path: "{{ backend_shared_env_path }}"
  register: backend_env_stat

- name: Env | 取出既有的 APP_KEY（要保留，不能每次部署都換掉）
  ansible.builtin.slurp:
    src: "{{ backend_shared_env_path }}"
  register: backend_env_slurp
  when: backend_env_stat.stat.exists
  no_log: true

# A7：不管走哪條分支，backend_env_existing_app_key 都要真的被定義出來，
# 後面才有東西可以引用。
#
# ⚠ 這裡刻意**完全不用 regex_search 的捕獲組**。
# ansible-core 的 regex_search 一旦帶了群組參數（例如 \\1），
# 在沒比對到的時候不是回傳 None，而是直接丟例外：
#   The filter plugin 'ansible.builtin.regex_search' failed:
#   'NoneType' object has no attribute 'group'
# 後面接的 | default(...) 根本沒有機會執行；而且 set_fact 的參數是在
# 「finalization」階段求值的，連 when: ... is search(...) 都擋不住它
#（2026-09-04 實測：加了 when 之後同一行照樣炸）。
#
# 所以改成純字串管線：切行 → 挑出 APP_KEY= 開頭 → 去掉鍵與引號。
# 沒有捕獲組就沒有 match.group，空輸入自然得到空清單。
# 取 last 是照 dotenv 的語意（同一個鍵重複時後面的贏）。
- name: Env | 既有 .env 的內容（檔案不存在時是空字串）
  ansible.builtin.set_fact:
    backend_env_text: "{{ backend_env_slurp.content | default('') | b64decode }}"
  no_log: true

- name: Env | 取出所有 APP_KEY= 的值
  ansible.builtin.set_fact:
    backend_env_app_key_lines: >-
      {{ backend_env_text.splitlines()
         | map('trim')
         | select('match', '^APP_KEY[ \t]*=')
         | map('regex_replace', '^APP_KEY[ \t]*=[ \t]*', '')
         | map('trim')
         | map('trim', '"')
         | list }}
  no_log: true

- name: Env | 解析既有 APP_KEY
  ansible.builtin.set_fact:
    backend_env_existing_app_key: >-
      {{ (backend_env_app_key_lines | last)
         if (backend_env_app_key_lines | length) > 0
         else '' }}
  no_log: true

# 優先序：vault 明給的 > shared/.env 既有的 > 空（稍後由 key:generate 補）
- name: Env | 決定本次要寫入的 APP_KEY
  ansible.builtin.set_fact:
    backend_app_key_effective: >-
      {{ backend_app_key if (backend_app_key | string | length) > 0
         else backend_env_existing_app_key }}
  no_log: true

- name: Env | APP_KEY 來源（不印值）
  ansible.builtin.debug:
    msg: >-
      APP_KEY 來源＝{{
        'vault_app_key' if (backend_app_key | string | length) > 0
        else ('shared/.env 既有值' if (backend_env_existing_app_key | string | length) > 0
              else '尚無 —— 稍後會跑一次 artisan key:generate --force')
      }}

# 0640 deploy:{{ web_group }}：
#   deploy 要能寫（key:generate 透過 symlink 寫回這個檔）；
#   php-fpm 以 {{ web_user }} 執行，只需要讀；
#   others 完全沒有權限。
- name: Env | 渲染 shared/.env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ backend_shared_env_path }}"
    owner: "{{ deploy_user }}"
    group: "{{ web_group }}"
    mode: "0640"
    backup: false
  register: backend_env_written
  no_log: true

- name: Env | shared/.env 寫入結果
  ansible.builtin.debug:
    msg: >-
      {{ backend_shared_env_path }}
      {{ '已更新' if backend_env_written.changed else '內容未變' }}
      （0640 {{ deploy_user }}:{{ web_group }}）

---
# ============================================================================
# roles/nginx_myguard/defaults/main.yml
#
# MyGuard APT 的 nginx + ModSecurity(或 Coraza) + OWASP CRS。
# 前半段是共用核心變數的鏡像（正本在 roles/common/defaults/main.yml，實務上請提升到
# group_vars/all/main.yml）；鏡像的目的只是讓 `--tags nginx` 能單獨跑。
# ============================================================================

# ---- 共用核心鏡像 ----------------------------------------------------------
app_name: "pm"
app_slug: "pm"
app_env: "production"
app_domain: ""                       # ← 必填，assert 會擋佔位值
app_root: "/srv/{{ app_slug }}"
backend_root: "{{ app_root }}/backend"
backend_current_path: "{{ backend_root }}/current"
frontend_root: "{{ app_root }}/frontend"
frontend_current_path: "{{ frontend_root }}/current"
frontend_static_root: "{{ frontend_current_path }}/.output/public"
deploy_user: "deploy"
web_user: "www-data"
web_group: "www-data"
app_log_dir: "/var/log/{{ app_slug }}"

# A20：nuxt.config.ts 已寫成 `const ssr = process.env.NUXT_SSR !== 'false'`，預設 ssr。
frontend_mode: "ssr"
# A10：PM2 一律 fork，水平擴充是 N 個 fork 綁 frontend_port..frontend_port+N-1，
# 這裡的 upstream 必須跟 nodejs_pm2 的 ecosystem.config.cjs 產生的埠一一對應。
# 注意變數名是 frontend_instances（本專案正本），不是 pm2_instances。
frontend_host: "127.0.0.1"
frontend_port: 3000
frontend_instances: 1

# php role 的正本值；這裡鏡像是為了 vhost 的 fastcgi_pass 與 A16 斷言。
php_version: "8.5"
php_fpm_socket: "/run/php/php{{ php_version }}-fpm-{{ app_slug }}.sock"
app_upload_post_overhead_mb: 8
php_post_max_size: "{{ (app_max_upload_mb | int) + (app_upload_post_overhead_mb | int) }}M"

# ---- A16：上傳限制的唯一來源 -----------------------------------------------
# 鏈：app_max_upload_mb → php_upload/php_post → nginx_client_max_body_size
#     → waf_request_body_limit（必須最大）
# 這裡的加成刻意等於 preflight_nginx_overhead_mb / preflight_waf_overhead_mb，
# preflight/tasks/uploads.yml 會把四個值換算成 bytes 再驗一次順序。
# ⚠ A16 單一來源：app_max_upload_mb 與四個推導值的**正本在
#    inventory/group_vars/all.yml**（inventory group_vars 的優先權高於 role defaults）。
#    這裡只保留一個「role 單獨執行時的 fallback」，數值必須與正本一致。
#    曾經在 5 個 role defaults 各放一份，其中 php 是 64、其他是 32 ——
#    group_vars 在時看不出來，一旦沒帶 inventory 就會靜默產生 413。
app_max_upload_mb: 32
app_upload_nginx_overhead_mb: 16
nginx_client_max_body_size: "{{ (app_max_upload_mb | int) + (app_upload_nginx_overhead_mb | int) }}m"

# ---- nginx 基本路徑 --------------------------------------------------------
nginx_binary: /usr/sbin/nginx
nginx_service: nginx
nginx_conf_dir: /etc/nginx
nginx_conf_d: "{{ nginx_conf_dir }}/conf.d"
nginx_snippets_dir: "{{ nginx_conf_dir }}/snippets"
nginx_sites_available: "{{ nginx_conf_dir }}/sites-available"
nginx_sites_enabled: "{{ nginx_conf_dir }}/sites-enabled"
nginx_modules_enabled_dir: "{{ nginx_conf_dir }}/modules-enabled"
nginx_log_dir: /var/log/nginx
nginx_packages:
  - nginx
# 硬性版本下限。Ubuntu noble 自帶 1.24；MyGuard 宣稱 1.30 stable，但我無法從這裡
# 驗證，所以下限只設 1.24（http2 的寫法會依實際版本自動切換，見 facts.yml）。
# 要強制 1.30 就把這個值改成 "1.30.0"。
nginx_min_version: "1.24.0"

# vhost 落點：留空 = 依 nginx.conf 是否 include sites-enabled 自動決定（facts.yml）。
# MyGuard 的打包佈局未知，不能假設一定有 sites-available/sites-enabled。
nginx_vhost_path: ""
nginx_vhost_link: ""

# 唯一的刪除動作：停用發行版預設站台。三重 gate ——
#   (1) 這個變數；(2) tasks 的 when（檔案存在且必須是 symlink）；(3) 路徑 assert。
# 只動 sites-enabled 的 symlink，永遠不碰 sites-available 裡的原檔。
nginx_disable_default_site: true
nginx_default_site_link: "/etc/nginx/sites-enabled/default"

# ---- vhost 行為 ------------------------------------------------------------
nginx_extra_server_names: []
nginx_server_names: "{{ [app_domain] + nginx_extra_server_names }}"
nginx_default_server: true
nginx_listen_ipv6: true
nginx_index: "index.php"
nginx_fastcgi_read_timeout: "70s"     # 必須 > php_fpm_request_terminate_timeout(60s)
nginx_upstream_keepalive: 32
nginx_proxy_read_timeout: "60s"
nginx_proxy_connect_timeout: "5s"
nginx_static_expires: "30d"
nginx_storage_expires: "7d"
nginx_nuxt_asset_expires: "1y"
nginx_gzip_enabled: true
nginx_gzip_types:
  - text/plain
  - text/css
  - text/xml
  - text/javascript
  - application/javascript
  - application/json
  - application/xml
  - application/rss+xml
  - application/manifest+json
  - image/svg+xml
  - font/woff2
nginx_stub_status_enabled: false

# 限流。zone 名稱一律以 app_slug 前綴，避免跟同機其他 vhost 的 zone 撞名。
nginx_limit_req_rate: "30r/s"
nginx_limit_req_burst: 60
nginx_limit_req_zone_size: "10m"
nginx_limit_req_login_rate: "10r/m"
nginx_limit_req_login_burst: 5
nginx_login_rate_limit_enabled: true
nginx_login_paths_regex: '^/(admin/login|api/login|login|register|forgot-password|reset-password)$'
nginx_limit_conn: 32

# 在 CDN / L7 LB 後面才填；空清單就完全不輸出 set_real_ip_from。
nginx_real_ip_from: []
nginx_real_ip_header: "X-Forwarded-For"

# ---- 安全標頭（A14）--------------------------------------------------------
nginx_x_frame_options: "SAMEORIGIN"
nginx_referrer_policy: "strict-origin-when-cross-origin"
nginx_coop: "same-origin"
# COEP/CORP：Docker 側一直有，原生側連變數都沒有。
nginx_coep: "credentialless"
nginx_corp: "same-origin"
nginx_permissions_policy: "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
# CSP 預設不開：Nuxt 的 hydration payload 與 Filament/Alpine 都有 inline script，
# 隨手加一條 default-src 'self' 會直接把後台弄壞。要開請先在 staging 用 Report-Only。
# 與 Docker 的 env/docker/edge/conf.d/pm-security-headers.inc 逐字相同。
# 原本是空字串 —— 也就是 Docker 有完整的 CSP、正式機一條都沒有，
# 而那正好是反過來的（正式機才是真的會被打的那一邊）。
# 要分階段導入可以用 nginx_csp_report_only（模板已支援 Report-Only）。
nginx_csp: >-
  default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval';
  style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;
  font-src 'self' data:; connect-src 'self' ws: wss:;
  frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'
# HSTS 只有在 nginx_tls_is_real 為真（拿到 Let's Encrypt 憑證）時才會輸出。
# 用 snakeoil 期間送 HSTS 會把使用者釘死在一張不受信任的憑證上。
nginx_hsts_enabled: true
# 讀 tls_hsts_max_age（inventory/group_vars/all.yml 用的名字）。
# 這兩個名字原本各自為政：all.yml 寫 15552000（180 天），這裡寫 31536000（1 年），
# 而模板只讀這裡的 —— 操作者按文件設 180 天，實際送出去的是 1 年。
# HSTS 的 max-age 一旦送到瀏覽器就無法從伺服器端撤銷，這個落差不能留。
nginx_hsts_max_age: "{{ tls_hsts_max_age | default(15552000) }}"
nginx_hsts_include_subdomains: true
nginx_hsts_preload: false            # 不可逆，預設關

# ---- TLS -------------------------------------------------------------------
# tls_enable 是 nginx 與 certbot 共用的總開關（兩個 role 的 defaults 都有鏡像）。
tls_enable: true
nginx_ssl_protocols: "TLSv1.2 TLSv1.3"
nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
nginx_ssl_dhparam_path: ""
# A5：snakeoil 開機用的憑證。ssl-cert 套件提供。
nginx_snakeoil_cert: "/etc/ssl/certs/ssl-cert-snakeoil.pem"
nginx_snakeoil_key: "/etc/ssl/private/ssl-cert-snakeoil.key"
nginx_letsencrypt_live_dir: "/etc/letsencrypt/live/{{ app_domain }}"
# ACME webroot。certbot role 的 defaults 有同名鏡像，兩邊必須一致。
certbot_webroot: "/var/www/letsencrypt"

# ---- MyGuard APT -----------------------------------------------------------
# 站台：https://deb.myguard.nl/
# 注意這個 URI 佈局很不尋常（suite 與路徑同名，apt 實際會抓
# .../apt/dists/<codename>/dists/<codename>/Release）。這是照站台說明填的預設值，
# repo.yml 會在安裝前 HEAD 探測，404 就 fail 並給可行動的三個選項。
# 讀 waf_repo_manage（all.yml 與 env/ansible/README.md §5.2 用的名字）。
# README 把 waf_repo_manage: false 當成「MyGuard 套件解析失敗時的逃生門」，
# 但在 2026-09-04 之前 role 只讀 nginx_myguard_repo_manage，
# 那個逃生門按下去完全沒有反應。
nginx_myguard_repo_manage: "{{ waf_repo_manage | default(true) }}"
nginx_myguard_repo_probe: true
# ⚠ waf_repo_base 是**完整 URL**（all.yml 寫 https://deb.myguard.nl），
# 而這個變數要的是**純主機名** —— 它會被拿去組 keyring 的檔案路徑：
#   /etc/apt/keyrings/{{ nginx_myguard_host }}.gpg
# 直接接過來會變成 /etc/apt/keyrings/https://deb.myguard.nl.gpg，
# 那不是一個合法路徑，deb822 來源檔名與 apt pin 檔名也會含 "://"。
# 所以要先把 scheme 與後面的路徑剝掉。
nginx_myguard_host: >-
  {{ (waf_repo_base | default('https://deb.myguard.nl'))
     | regex_replace('^[a-z]+://', '')
     | regex_replace('/.*$', '') }}
nginx_myguard_suite: "{{ waf_repo_suite | default(ansible_facts['distribution_release']) }}"
nginx_myguard_uri: "{{ waf_repo_uri | default('https://' ~ nginx_myguard_host ~ '/apt/dists/' ~ nginx_myguard_suite) }}"
nginx_myguard_components: "{{ waf_repo_components | default(['main']) }}"
nginx_myguard_architectures: >-
  {{ 'amd64' if ansible_architecture == 'x86_64'
     else ('arm64' if ansible_architecture == 'aarch64' else ansible_architecture) }}
nginx_myguard_key_url: "{{ waf_repo_key_url | default('https://' ~ nginx_myguard_host ~ '/' ~ nginx_myguard_host ~ '.gpg') }}"
nginx_myguard_keyring: "{{ waf_repo_keyring | default('/etc/apt/keyrings/' ~ nginx_myguard_host ~ '.gpg') }}"
# 我沒有可信來源可以確認 MyGuard 的簽章金鑰指紋，因此**不編造**。
# 空清單 = 不比對，但每次執行都會印出實際讀到的指紋要你自行核對。
# 自行從官方管道確認之後把指紋填進來，就會變成強制比對。
nginx_myguard_key_fingerprints_allowed: []
# 設 true 表示「不接受未釘指紋的來源」——上面的白名單為空時會直接 fail。
nginx_myguard_require_key_pin: false
# apt pin：讓 MyGuard 的 nginx 壓過發行版自帶的版本。
# Pin: origin <hostname> 是用來源主機名比對，不需要知道 repo 的 Origin/Label 欄位。
nginx_myguard_pin: true
nginx_myguard_pin_priority: 1001
nginx_myguard_pin_file: "/etc/apt/preferences.d/90-{{ nginx_myguard_host | replace('.', '-') }}"

nginx_apt_retries: 30
nginx_apt_delay: 10

# ---- WAF：套件名防禦性解析 -------------------------------------------------
waf_enabled: true
# 主要名稱。找不到時依 waf_packages_alternates 的順序往下試。
waf_packages:
  - libnginx-mod-http-modsecurity
  - libmodsecurity3
  - modsecurity-crs
# 備選名稱。來源：
#   * libnginx-mod-http-coraza —— MyGuard 站台描述為
#     "OWASP Coraza WAF embedded in NGINX, libmodsecurity-compatible, CRS-ready"
#   * libmodsecurity3t64 —— Ubuntu noble 的 time_t 64-bit 轉換套件名
#   * coreruleset —— 部分發行版把 CRS 改名為這個
waf_packages_alternates:
  libnginx-mod-http-modsecurity:
    - libnginx-mod-http-modsecurity3
    - libnginx-mod-http-coraza
  libmodsecurity3:
    - libmodsecurity3t64
    - libcoraza
    - libmodsecurity
  modsecurity-crs:
    - coreruleset
    - owasp-modsecurity-crs
    - modsecurity-crs-extra
# 找不到就靜靜略過（會印 debug），不讓 play 失敗。
waf_packages_optional: []
# 解析失敗時用來列出「實際可用的候選」的搜尋條件。
waf_search_regex: 'modsecurity|coraza|crs|waf'

# nginx 的 WAF 指令前綴。Coraza 連接器宣稱 libmodsecurity-compatible，
# 但我無法確認它的 nginx 指令名是否真的相同，所以做成對照表 + 覆寫變數。
# 若指令名不對，handler 的 nginx -t 會立刻擋下並印出真正的錯誤，不會默默上線。
waf_directive_prefix_map:
  libnginx-mod-http-modsecurity: modsecurity
  libnginx-mod-http-modsecurity3: modsecurity
  libnginx-mod-http-coraza: modsecurity
waf_directive_prefix_default: modsecurity
waf_directive_prefix_override: ""

# 模組 .so 的搜尋位置與檔名樣式（不同打包放的位置不一樣）。
nginx_module_search_paths:
  - /usr/lib/nginx/modules
  - /usr/share/nginx/modules
  - /usr/lib/x86_64-linux-gnu/nginx/modules
  - /usr/lib/aarch64-linux-gnu/nginx/modules
nginx_waf_module_patterns:
  - 'ngx_http_modsecurity_module.so'
  - 'ngx_http_modsecurity*.so'
  - 'ngx_http_coraza_module.so'
  - 'ngx_http_coraza*.so'

# ---- WAF：檔案佈局 ---------------------------------------------------------
waf_dir: "{{ nginx_conf_dir }}/waf"
waf_main_rules_file: "{{ waf_dir }}/main.conf"
waf_engine_conf: "{{ waf_dir }}/modsecurity.conf"
waf_crs_setup_conf: "{{ waf_dir }}/crs-setup.conf"
waf_exclusions_before_dir: "{{ waf_dir }}/exclusions-before"
waf_exclusions_after_dir: "{{ waf_dir }}/exclusions-after"
waf_data_dir: "/var/cache/modsecurity"
waf_tmp_dir: "/var/cache/modsecurity/tmp"
waf_upload_dir: "/var/cache/modsecurity/upload"
waf_audit_log: "{{ nginx_log_dir }}/modsec_audit.log"
waf_debug_log: "{{ nginx_log_dir }}/modsec_debug.log"

# CRS 位置偵測。auto = 有 rules 目錄就用 rules_dir（完全自控），否則退回 load_file。
# rules_dir 模式刻意不 Include 發行版的 crs-setup.conf：那個檔含 SecAction id:900xxx，
# 跟我們自己的 crs-setup 一起載入會有重複 id 的風險。
waf_crs_include_mode: auto           # auto | rules_dir | load_file
waf_crs_rules_dir_candidates:
  - /usr/share/modsecurity-crs/rules
  - /usr/share/coreruleset/rules
  - /etc/modsecurity/crs/rules
  - /usr/share/owasp-modsecurity-crs/rules
waf_crs_load_candidates:
  - /usr/share/modsecurity-crs/owasp-crs.load
  - /usr/share/coreruleset/owasp-crs.load
  - /etc/modsecurity/crs/crs-setup.conf
waf_unicode_mapping_candidates:
  - /usr/share/modsecurity-crs/util/unicode.mapping
  - /usr/share/modsecurity/unicode.mapping
  - /etc/modsecurity/unicode.mapping
  - /etc/nginx/modsecurity.d/unicode.mapping
  - /usr/share/coreruleset/unicode.mapping

# ---- WAF：引擎參數 ---------------------------------------------------------
# 預設 On（不是 DetectionOnly）：本專案的目的就是要有 WAF，而且下面已經內建
# Livewire / Filament 的排除規則，verify.yml 也會用真實請求證明它在擋。
# 要先觀察再開就設成 DetectionOnly，block test 會自動跳過。
waf_rule_engine: "On"
waf_request_body_access: "On"
waf_response_body_access: "Off"
waf_response_body_mime: "text/plain text/html text/xml application/json"
waf_response_body_limit: 524288
app_upload_waf_overhead_mb: 32
# A16：必須 > nginx_client_max_body_size，否則 26–32MB 的上傳會過了 nginx 和 PHP
# 才被 WAF 擋成 413，而錯誤訊息完全指不到真正的原因。單位是 bytes。
waf_request_body_limit: "{{ ((app_max_upload_mb | int) + (app_upload_waf_overhead_mb | int)) * 1048576 }}"
# 非 multipart 的 body 上限。ModSecurity 建議值 131072(128KB) 對 Livewire 太小 ——
# Filament 的表格/表單一次送的 JSON snapshot 很容易破 1MB。
waf_request_body_no_files_limit: 4194304
waf_request_body_limit_action: "Reject"
waf_pcre_match_limit: 100000
waf_audit_engine: "RelevantOnly"
waf_audit_log_parts: "ABCEFHJKZ"
waf_audit_relevant_status: "^(?:5|4(?!04))"
waf_audit_log_format: "JSON"
waf_debug_log_level: 0               # 查誤判時暫時調 9
# 額外 Sec* 指令。libmodsecurity3 與 Coraza 對某些指令的支援度不一致
#（SecArgumentsLimit、SecRequestBodyJsonDepthLimit、SecStatusEngine…），
# 所以預設空；要加請先在 staging 跑 nginx -t 確認。
waf_extra_directives: []

# ---- CRS 設定（載入在 CRS 規則之前）---------------------------------------
# ⚠ tx.crs_setup_version 一定要有值。CRS 4 的規則 901001 是
#     SecRule &TX:crs_setup_version "@eq 0" "id:901001,phase:1,deny,status:500,..."
#   —— 沒設就是「每一個請求都回 500」，而訊息只會說 deployed without configuration。
waf_crs_setup_version: 400
waf_local_rule_id_base: 10000        # CRS 保留 900000+；1–99999 是本地規則範圍
# ── 三個「常用純量」的橋接 ──────────────────────────────────────────────────
# inventory/group_vars/all.yml 與兩個 .example 檔都提供了
#   waf_crs_paranoia_level / waf_crs_anomaly_threshold_inbound / _outbound
# 這三個好記的名字，但 CRS 真正吃的是下面 waf_crs_setup_vars 裡的 tx.* 鍵。
# 在 2026-09-04 之前這三個變數「不被任何 role、task、template 讀取」——
# 操作者把 paranoia 調到 2 完全不會有事發生，而且沒有任何警告。
#
# 這裡用 combine 把純量疊到 dict 上，讓那三個名字真的生效。
# 要更細的控制仍然可以直接改 waf_crs_setup_vars 的其他鍵。
waf_crs_paranoia_level: 1
waf_crs_anomaly_threshold_inbound: 5
waf_crs_anomaly_threshold_outbound: 4

waf_crs_setup_vars_effective: >-
  {{ waf_crs_setup_vars | combine({
       'tx.blocking_paranoia_level': waf_crs_paranoia_level,
       'tx.detection_paranoia_level': waf_crs_paranoia_level,
       'tx.inbound_anomaly_score_threshold': waf_crs_anomaly_threshold_inbound,
       'tx.outbound_anomaly_score_threshold': waf_crs_anomaly_threshold_outbound,
     }) }}

waf_crs_setup_vars:
  tx.blocking_paranoia_level: 1
  tx.detection_paranoia_level: 1
  tx.enforce_bodyproc_urlencoded: 1
  tx.critical_anomaly_score: 5
  tx.error_anomaly_score: 4
  tx.warning_anomaly_score: 3
  tx.notice_anomaly_score: 2
  tx.inbound_anomaly_score_threshold: 5
  tx.outbound_anomaly_score_threshold: 4
  tx.allowed_methods: "GET HEAD POST OPTIONS PUT PATCH DELETE"
  tx.allowed_request_content_type: "|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/json| |application/cloudevents+json|"
  tx.allowed_http_versions: "HTTP/1.0 HTTP/1.1 HTTP/2 HTTP/2.0 HTTP/3 HTTP/3.0"

# ---- A11：CRS 排除規則 -----------------------------------------------------
# 載入順序（由 waf_main_rules_file 決定，不可調換）：
#   modsecurity.conf → crs-setup.conf → exclusions-before/*.conf → CRS → exclusions-after/*.conf
#
# 為什麼要拆 phase：ctl:ruleRemoveById 只影響「同一 phase 中尚未執行」的規則。
# 920xxx（協定強制）是 phase 1，941/942xxx（XSS/SQLi）是 phase 2。
# 用一條 phase:2 的規則去 ruleRemoveById 920273 是完全無效的 —— 那條規則早就跑完了。
# 所以下面刻意拆成 phase:1 與 phase:2 兩組。
#
# 模板會把所有 action 用「逗號」串起來（acts | join(',')）。
# 分號會讓 ModSecurity 拒絕載入整份設定、nginx 以 emerg 起不來。
# 注意 ctl:ruleRemoveTargetById=942440;ARGS:foo 這種寫法本身內含分號，
# 那是「id;target」的分隔，跟 action 之間的逗號是兩回事 —— 用 extra_actions 傳。
waf_exclusions_before:
  - id: 10010
    phase: 1
    comment: >-
      Livewire v4（Filament v5 的底層）—— phase 1。/update 送的是整個元件狀態的
      JSON 快照，裡面常有 CRS 認定為「協定異常」的字元。前綴由 APP_KEY 推導
      （/livewire-<hash>/），所以用 @rx 而不是 @beginsWith /livewire/ ——
      後者一條都比對不到，ruleEngine=On 之下後台每次互動都被 941/942 擋成 403。
    condition: 'REQUEST_URI "@rx ^/livewire(-[0-9a-zA-Z]+)?/"'
    remove_ids: [920273, 920274]
  - id: 10011
    phase: 2
    comment: >-
      Livewire —— phase 2（941 XSS / 942 SQLi 的誤判）。前綴形狀同 10010。
      逐條列 ID 的做法在這裡是**結構性錯誤**，不是漏了幾條而已：
      Docker 側的 CRS 由 compose 釘住（4.28），原生側由 MyGuard 的 apt repo 決定
      （目前 4.30），兩邊本來就不同版，而 CRS 每次改版都會新增規則。
      2026-09-05 一天之內就被咬兩次 —— 先是 CRS 4 才有的 941390
      （Javascript method detected），補上之後原生側又冒出 942550
      （JSON-Based SQL Injection）。改成依 tag 移除，才不會每次上游加規則就再壞一次。
      attack-sqli 與 attack-xss 是 CRS 4 穩定的標籤（942 家族 60 條全帶前者）。
      範圍沒有變寬：原本列的 941/942 就是這兩個家族，只是列不齊。
      這條路徑上真正的防線是 Laravel 的預備語句與轉義，加上後台本來就要登入。
    condition: 'REQUEST_URI "@rx ^/livewire(-[0-9a-zA-Z]+)?/"'
    remove_tags: ['attack-sqli', 'attack-xss']
  - id: 10012
    phase: 1
    comment: Filament 後台 /admin —— phase 1
    condition: 'REQUEST_URI "@beginsWith /admin"'
    remove_ids: [920273]
  - id: 10013
    phase: 2
    comment: >-
      Filament 後台 /admin —— phase 2。富文字欄位與表格篩選器送出的內容
      幾乎必定會踩到 941/942。理由同 10011：依 tag 而不是逐條列 ID。
    condition: 'REQUEST_URI "@beginsWith /admin"'
    remove_tags: ['attack-sqli', 'attack-xss']
  - id: 10014
    phase: 1
    comment: >-
      Laravel 的健康檢查端點（bootstrap/app.php 的 health: '/up'）。
      監控系統的 User-Agent 常被 913xxx 當成掃描器。
    condition: 'REQUEST_URI "@streq /up"'
    extra_actions:
      - "ctl:ruleEngine=DetectionOnly"

# SecRuleUpdateTargetById。預設空 —— 這個指令若引用「不存在的規則 ID」，
# ModSecurity v3 會在**載入階段**就報錯，nginx 直接起不來。
# waf.yml 有一段真的會執行的 grep，只寫出 CRS 裡確實存在的 ID，
# 所以就算你把下面的範例打開也不會炸。範例見 templates/exclusions-after.conf.j2 檔頭。
#   - id: 942440
#     comment: "Laravel CSRF token 與 session cookie 裡的 -- 序列"
#     targets: ["!ARGS:_token", "!REQUEST_COOKIES:/^(XSRF-TOKEN|laravel_session)$/"]
waf_exclusions_after: []

# 靜態資產不過 WAF：省 CPU，也避免 hash 檔名觸發誤判。
waf_static_bypass: true

# ---- 驗證 ------------------------------------------------------------------
# verify 時真的送一個帶攻擊特徵的請求，斷言 WAF 回 403。
# 只有 waf_rule_engine == 'On' 時才會跑。
waf_verify_block_test: true
waf_block_test_user_agent: "nikto"   # 觸發 CRS 913100（severity CRITICAL=5 >= 門檻 5）
nginx_verify_http_check: true
# 深度檢查（/up 必須回 200）。第一次部署時後端還沒 clone，所以預設關；
# deploy role 跑完之後再打開。
nginx_verify_app_response: false

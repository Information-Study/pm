# ─────────────────────────────────────────────────────────────────────────────
# pm — Ansible 原生部署設定
#
# 執行方式（重要）：一律「在 ansible/ 目錄底下」執行，例如
#   cd ansible && ansible-galaxy collection install -r requirements.yml
#   cd ansible && ansible-playbook -i inventory/hosts.yml site.yml --check --diff
# 本檔中的相對路徑以本檔所在目錄為基準（ansible-core 2.15+ 的 path 型別會以
# 設定檔目錄 unfrack）；但為了不依賴這個細節，仍請從 ansible/ 目錄執行。
# ─────────────────────────────────────────────────────────────────────────────

[defaults]
inventory                  = ./inventory/hosts.yml
roles_path                 = ./roles

# A17：collections_path 是「取代」而不是「附加」預設搜尋路徑。
# 只寫 ./collections 會讓 `ansible-galaxy collection install -r requirements.yml`
# （預設裝到 ~/.ansible/collections）安裝的內容變成找不到。
# 必須把預設的兩個路徑一起列回來。
collections_path           = ./collections:~/.ansible/collections:/usr/share/ansible/collections

# 目標端 Python 直譯器：Ubuntu 24.04/26.04 一律 /usr/bin/python3，自動偵測即可，
# auto_silent 只是把每台主機的偵測訊息關掉。
interpreter_python         = auto_silent

# 安全預設：不要關掉 host key 檢查。第一次連線請先
#   ssh-keyscan -H <host> >> ~/.ssh/known_hosts
host_key_checking          = True

# A5 / hardening：force_handlers 必須維持 False。
# hardening/sshd 的流程是「寫入片段 → 立刻 sshd -t 驗證 → 失敗就 rescue 移除並中止」，
# 中止時 handler 不可以被執行，否則會拿著壞掉的設定去 restart sshd 而把自己鎖在門外。
force_handlers             = False

retry_files_enabled        = False
display_skipped_hosts      = False
deprecation_warnings       = True
result_format              = yaml
forks                      = 10
timeout                    = 30
gathering                  = smart
fact_caching               = memory

# ── ansible_managed 為什麼不在這裡 ──────────────────────────────────────────
# 這一格原本是 `ansible_managed = ...`（DEFAULT_MANAGED_STR）。
# ansible-core 2.21 起已 deprecated、2.23 移除，而且它只對 **template 模組**
# 生效 —— template 會把 ansible_managed 注入渲染的變數空間，但
# `copy: content: |` 裡的 {{ ansible_managed }} 是從一般變數命名空間解析的，
# 那裡沒有這個名字，於是實跑會直接 fatal：
#   Error while resolving value for 'content': 'ansible_managed' is undefined
# 這個失敗只有真的對主機跑才會出現（--syntax-check 與 ansible-lint 都看不到）。
#
# 依 deprecation 訊息的建議，改成一般變數定義在
# inventory/group_vars/all/main.yml，template 與 copy 兩邊就都拿得到。

# 需要 ansible.posix collection（requirements.yml 裝完之後才能打開），
# 否則第一次跑會出現 callback 找不到的警告。
# callbacks_enabled        = ansible.posix.profile_tasks, ansible.posix.timer

# vault：hosts.yml 與 vault_pass 都在 .gitignore 內，不要把密碼檔路徑寫死進版控。
# vault_password_file      = ./.vault_pass

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml
unparsed_is_failed = True

[privilege_escalation]
# 提權由 playbook / play 決定，不在這裡預設打開。
become          = False
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
# pipelining 需要目標端 sudoers 沒有 requiretty（Ubuntu/Debian 預設就沒有）。
pipelining      = True
ssh_args        = -C -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=15
retries         = 2

# ── app 容器的 PHP vhost ────────────────────────────────────────────────────
# 掛到 /etc/nginx/http.d/default.conf。edge 會把 /api|/admin|/up|/storage|/livewire
# 轉到這裡；本檔不做前後端分流，收到什麼就交給 Laravel。

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # /up 是 Laravel 13 內建的健康檢查端點（bootstrap/app.php 的 health:）。
    # base compose 的 app healthcheck 打的就是這個。
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        # Filament 的匯出/匯入與大型表單可能久一點；但不要無上限，
        # 否則 php-fpm 的 worker 會被慢查詢卡死到 max_children 用光。
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # 只允許 /index.php 走 fastcgi。任何其他 .php 一律 404 ——
    # public/ 底下不該有第二個可執行的入口。
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

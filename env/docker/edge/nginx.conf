# ── edge 反向代理的主設定 ───────────────────────────────────────────────────
# 官方 nginx:alpine 映像。三個模式都跑這一份。
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format edge '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout edge;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # 必須 >= 後端 app 的 client_max_body_size（64m），否則大檔會在 edge 就被截，
    # 而 Laravel 那邊完全看不到請求，錯誤訊息會指向錯的地方。
    client_max_body_size 64m;

    # WAF 在 edge 前面（test 模式），要把真實 client IP 傳下去。
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    # 與原生側對齊（nginx-http-tuning.conf.j2 是 256）。
    # 兩邊不同的話，同一個回應在 Docker 不壓、在正式機壓 ——
    # 而壓縮會影響的不只是大小，還有 Content-Length 與某些中介的行為。
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml text/javascript image/svg+xml;

    # ── H2C smuggling 防護 ──────────────────────────────────────────────
    # 這個 map 決定要不要把 Connection: upgrade 轉給上游。
    #
    # 只寫 `default upgrade;` 是有問題的：任何 Upgrade 值都會被原封不動轉出去，
    # 包含 `Upgrade: h2c`。上游若支援明文 HTTP/2，攻擊者就能把連線升級成
    # edge 看不懂的協定，之後所有請求都繞過這一層的路由與安全標頭
    #（Semgrep 的 possible-nginx-h2c-smuggling）。
    #
    # 所以改成白名單：只有 websocket 才放行升級，其餘一律 close。
    # HMR（Vite）與 Nitro 的即時連線用的就是 websocket，功能不受影響。
    map $http_upgrade $connection_upgrade {
        default    close;
        websocket  upgrade;
    }

    # 同理，只把已知安全的 Upgrade 值傳給上游。
    map $http_upgrade $safe_upgrade {
        default    "";
        websocket  websocket;
    }

    # ── X-Forwarded-Port 的來源 ─────────────────────────────────────────
    # $server_port 是 edge 自己監聽的埠（永遠 8080），不是使用者連進來的埠。
    # dev 剛好發布 8080 所以看不出問題；test(18080) / WAF(18081) / prod(80)
    # 都會讓 Laravel 產生指向 8080 的絕對網址與 302 —— 而 prod 沒發布 8080。
    #
    # 優先序：
    #   1. 上游代理傳來的 X-Forwarded-Port（test 模式的 WAF 會傳，
    #      因為它的 `Host $host` 會把埠去掉，edge 從 Host 已經還原不出來）
    #   2. 使用者送來的 Host 標頭裡的埠
    #   3. 由 scheme 推導（80 / 443）—— Host 沒帶埠時的預設情形
    #
    # 採信上游的 X-Forwarded-Port 是有前提的：edge 在容器網路內，
    # 唯一會設這個標頭的上游是同網段的 waf。它只影響 URL 生成，
    # 不參與任何授權決策。

    # Host 沒帶埠時（80 / 443 的預設情形）不能退回 $server_port ——
    # 那是 edge 自己監聽的 8080。
    map $scheme $pm_scheme_port {
        default  80;
        https    443;
    }

    map $http_host $pm_host_port {
        default                     $pm_scheme_port;
        "~^[^:]+:(?<pm_hp>[0-9]+)$" $pm_hp;
    }

    map $http_x_forwarded_port $pm_forwarded_port {
        default        $pm_host_port;
        "~^[0-9]{1,5}$" $http_x_forwarded_port;
    }

    include /etc/nginx/conf.d/*.conf;
}

title = "pm gitleaks 設定"

[extend]
useDefault = true

[[allowlists]]
description = ".env.example 是刻意提交的範本，所有值皆為空"
paths = ['''\.env\.example$''']

[[allowlists]]
description = "lock 檔的 integrity 雜湊不是憑證"
paths = ['''(package-lock\.json|composer\.lock)$''']

[[allowlists]]
description = "文件中示範用的假 token"
regexes = ['''(EXAMPLE|PLACEHOLDER|CHANGEME|xxxx+)''']

[[allowlists]]
description = "第三方相依不是我們的祕密責任範圍（也會拖慢掃描）"
paths = [
    '''(^|/)vendor/''',
    '''(^|/)node_modules/''',
    '''(^|/)\.nuxt/''',
    '''(^|/)\.output/''',
]

[[allowlists]]
description = "APT/GPG 公鑰指紋是公開資訊，用來驗證套件來源，不是憑證"
regexTarget = "line"
regexes = [
    '''(?i)_key_fingerprint:\s*"?[0-9A-Fa-f]{40}"?''',
    '''(?i)signing_key_fingerprint''',
    '''keyserver\.ubuntu\.com/pks/lookup''',
]

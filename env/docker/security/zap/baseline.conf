# ZAP baseline 規則調整。
#
# 格式（TAB 分隔，一行一條）：
#     <ruleId>	<WARN|IGNORE|FAIL>	<說明>
#
# ── 目前刻意是空的 ────────────────────────────────────────────────────────
# 這個檔案原本有兩行被註解掉的 IGNORE（10015 快取控制、10063
# Permissions-Policy），而 README 把它們寫成「已經生效的調整」。
# 兩件事都不對：
#
#   1. 被 `#` 開頭的行對 ZAP 而言不存在，所以那兩條從來沒有生效過；
#   2. 更重要的是，那兩條規則**根本沒有觸發過**。2026-09-04 的實跑
#      （reports/dast/blocking/report.json）只出現 10055（CSP，risk=2）
#      與 10109／10049 兩個 informational，沒有 10015 也沒有 10063 ——
#      edge 的安全標頭已經處理掉它們了。
#
# 所以不是「把註解拿掉就好」：為沒有觸發的規則寫 IGNORE，等於預先把
# 未來真的發生的回歸靜音掉。空的才是誠實的狀態。
#
# ── 什麼時候該加一行 ──────────────────────────────────────────────────────
# 只有在「這條 alert 確實會出現，而且我們已經判定它在本專案不適用」時才加，
# 並且要寫下判定的理由與日期。加的時候記得**不要**用 `#` 開頭。
#
# 例（假設某天 10015 真的開始出現）：
# 10015	IGNORE	2026-09-05 判定：靜態資產的快取標頭由 edge 統一處理，見 env/docker/edge/conf.d/

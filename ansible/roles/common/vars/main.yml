---
# 這裡放「推導出來的」清單。放 vars/ 而不是 defaults/ 是刻意的：
# 這些是從 app_root 等變數算出來的結果，不該被個別覆蓋。
# 要加自己的目錄請用 common_extra_directories（在 defaults/）。

# A8：目錄骨架必須在 deploy role 之前一次建好，而且 owner 是 deploy。
# 否則 deploy 以 deploy 身分 clone 時，父目錄還是 root:root 0755 →
# "could not create work tree dir: Permission denied"。
common_core_directories:
  # ⚠ app_root 的 mode 必須跟 ACL mask 一致，否則 directories.yml 與 acl.yml
  #   會每次執行互相覆蓋。機制：mode 的**群組三位元顯示的是 ACL mask**，
  #   不是 group:: 本身。common_acl_root_entries 給了 deploy rwx，
  #   所以 mask 必然是 rwx、stat 讀出來就是 02770；
  #   而 common_dir_mode 是 02750 → file 模組每次都覺得要改回去。
  #
  #   這不只是 changed 數字難看而已：file 把 mode 設成 02750 的當下，
  #   **mask 被縮成 r-x，deploy 對 app_root 的寫入權限就沒了**，
  #   要等到 acl.yml 再跑一次才恢復。同一次執行裡 directories.yml 在
  #   acl.yml 之前，所以最後會收斂 —— 但只要有人用 --tags 只跑其中一個
  #   （或 acl.yml 因 common_manage_acl=false 被跳過），就會留下壞掉的權限。
  #
  #   others 仍然是 0，安全需求沒有放寬；中間那個 7 是 ACL mask，
  #   group:: 本身還是 r-x（getfacl 看得到）。
  - path: "{{ app_root }}"
    mode: "{{ '02770' if (common_manage_acl | bool) else common_dir_mode }}"
  # nodejs_pm2 的 pm2_ecosystem_dir 是 {{ app_root }}/shared/pm2，
  # 這一層必須先由 deploy 擁有，否則 pm2 role 以 deploy 身分寫檔會 EACCES。
  - path: "{{ app_shared_dir }}"
  - path: "{{ backend_root }}"
  - path: "{{ backend_releases_dir }}"
  - path: "{{ backend_shared_dir }}"
  - path: "{{ frontend_root }}"
  - path: "{{ frontend_releases_dir }}"
  - path: "{{ frontend_shared_dir }}"
  # A9：frontend_mode 狀態檔的父目錄。deploy role 會往裡面寫「上一次用哪個模式」，
  # 用來判斷模式切換時要不要清掉舊的 .output。
  - path: "{{ frontend_mode_state_file | dirname }}"

# Laravel 的 shared/storage 樹：www-data（php-fpm）要能寫，所以是 02770。
common_laravel_shared_directories:
  - "{{ backend_shared_dir }}/storage"
  - "{{ backend_shared_dir }}/storage/app"
  - "{{ backend_shared_dir }}/storage/app/private"
  - "{{ backend_shared_dir }}/storage/app/public"
  - "{{ backend_shared_dir }}/storage/framework"
  - "{{ backend_shared_dir }}/storage/framework/cache"
  - "{{ backend_shared_dir }}/storage/framework/cache/data"
  - "{{ backend_shared_dir }}/storage/framework/sessions"
  - "{{ backend_shared_dir }}/storage/framework/testing"
  - "{{ backend_shared_dir }}/storage/framework/views"
  - "{{ backend_shared_dir }}/storage/logs"

# A9：日誌目錄。
#   php_log_dir 缺席對 php-fpm 是硬錯誤 ——
#   "ERROR: Unable to create or open slowlog(...)" → "FPM initialization failed"，
#   服務根本起不來，而且訊息不會告訴你是目錄不存在。
common_log_directories:
  - path: "{{ php_log_dir }}"
  - path: "{{ app_log_dir }}"

common_sudoers_file: "/etc/sudoers.d/60-{{ app_slug }}-deploy"
common_logrotate_file: "/etc/logrotate.d/{{ app_slug }}"

# ---- ACL（tasks/acl.yml）----------------------------------------------------
# 頂層只設一次，不遞迴：app_root 底下有 releases 與 node_modules，
# 每次部署都遞迴會很慢，而 default 規則會讓新建的自動繼承。
common_acl_root_entries:
  - {path: "{{ app_root }}", entity: "{{ web_user }}", perms: "rx", default: false}
  - {path: "{{ app_root }}", entity: "{{ web_user }}", perms: "rx", default: true}
  - {path: "{{ app_root }}", entity: "{{ deploy_user }}", perms: "rwx", default: false}
  - {path: "{{ app_root }}", entity: "{{ deploy_user }}", perms: "rwx", default: true}

# 兩邊都要能寫的路徑。bootstrap/cache 在 release 裡，由 deploy_backend 處理；
# 這裡只管 shared/ 底下持久存在的那些。
common_acl_writable_paths:
  - "{{ backend_shared_dir }}/storage"

common_acl_writable_entries:
  - {entity: "{{ web_user }}", perms: "rwx", default: false}
  - {entity: "{{ web_user }}", perms: "rwx", default: true}
  - {entity: "{{ deploy_user }}", perms: "rwx", default: false}
  - {entity: "{{ deploy_user }}", perms: "rwx", default: true}

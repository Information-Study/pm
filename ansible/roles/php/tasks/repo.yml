---
# ---- A6：deb822_repository 需要目標機上有 python3-debian ---------------------
- name: 檢查 python3-debian 是否可匯入
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - "-c"
      - "import debian.deb822"
  register: php_pydebian
  changed_when: false
  # changed_when: false 已宣告本 task 是唯讀查詢，那就必須在 --check 下也真的執行。
  # 少了 check_mode: false，ansible 會跳過它，register 出來的變數沒有 stdout/status，
  # 下游的 assert / set_fact 就會拿到 default 值並報出**指向錯誤方向**的訊息
  #（實測：php8.5 明明裝好了，cx deploy check 卻說「APT 來源找不到 php8.5-fpm」）。
  check_mode: false
  failed_when: false

- name: python3-debian 缺失時給可行動訊息
  ansible.builtin.assert:
    that:
      - php_pydebian.rc == 0
    fail_msg: >-
      目標機沒有 python3-debian，ansible.builtin.deb822_repository 無法執行
      （模組會報 "Failed to import the required Python library (python-debian)"）。
      common role 必須在任何 repo 任務之前安裝 python3-debian 與 python3-apt。
      臨時解法：ansible -m raw -a 'apt-get update && apt-get install -y python3-debian python3-apt' <host>
    quiet: true

- name: 安裝 repo 前置套件
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 建立 APT keyrings 目錄
  ansible.builtin.file:
    path: "{{ php_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# ============================================================================
# Ubuntu → ondrej/php PPA
# ============================================================================
# force: false 只保證「已存在就不重寫」，**不保證不連網**。
# --check 之下 get_url 會先對 url 發一個 HEAD 去判斷「會不會改變」，
# 而 keyserver.ubuntu.com 的 /pks/lookup 不支援 HEAD，回 405 Method Not Allowed：
#     HTTP Error 405: Method Not Allowed
#     url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x...
# 於是 `cx deploy check` 在一台**已經部署過**的機器上必定紅燈 ——
# 而訊息看起來像金鑰壞了，其實只是 dry-run 用錯了 HTTP method。
#
# 解法是把「已經有了就不用抓」這個判斷改成在本地做（stat），
# 而不是丟給 get_url 去問遠端。檔案在 → when 直接跳過，一個網路請求都不發。
- name: 檢查 ondrej keyring 是否已存在（Ubuntu）
  ansible.builtin.stat:
    path: "{{ php_ondrej_keyring }}"
  register: php_ondrej_keyring_stat
  changed_when: false
  check_mode: false
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: 下載 ondrej/php PPA 簽章金鑰（Ubuntu）
  ansible.builtin.get_url:
    url: "{{ php_ondrej_key_url }}"
    dest: "{{ php_ondrej_keyring }}"
    owner: root
    group: root
    mode: "0644"
    force: false          # 已存在就不重抓，避免 keyserver 的 Comment header 造成假 changed
    timeout: 30
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - not (php_ondrej_keyring_stat.stat.exists | default(false))

- name: 讀出 ondrej 金鑰指紋（Ubuntu）
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      gpg --batch --no-tty --show-keys --with-colons {{ php_ondrej_keyring | quote }}
      | awk -F: '$1 == "fpr" { print $10 }'
    executable: /bin/bash
  # ⚠ check_mode: false + failed_when: false 是一組的，缺一不可。
  #
  # --check 之下 shell/command 預設會被**跳過**，register 出來的物件沒有
  # stdout_lines，於是下一個 assert 參照到未定義的欄位而失敗 ——
  # `cx deploy check` 在一台全新機器上因此必然紅燈，而訊息完全指向錯誤的方向。
  #
  # 讀取金鑰指紋不改變任何狀態，在 check 模式真的執行它是安全的。
  # 但全新機器上 keyring 還不存在（get_url 在 check 模式被跳過），
  # gpg 會失敗 —— 所以 failed_when: false，改由下面的 assert 用
  # 「有沒有讀到東西」來決定要不要比對。
  # mysql role 早就是這個模式，這裡補齊。
  register: php_ondrej_fpr
  failed_when: false
  check_mode: false
  changed_when: false
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: 驗證 ondrej 金鑰指紋（Ubuntu）
  ansible.builtin.assert:
    that:
      - php_ondrej_key_fingerprint in (php_ondrej_fpr.stdout_lines | default([]))
    fail_msg: >-
      {{ php_ondrej_keyring }} 的指紋不是預期的 {{ php_ondrej_key_fingerprint }}
      （實際讀到：{{ php_ondrej_fpr.stdout_lines | join(', ') | default('（空）', true) }}）。
      預期值取自 Launchpad API 的 signing_key_fingerprint：
      https://api.launchpad.net/devel/~ondrej/+archive/ubuntu/php
      在確認上游真的換鑰之前，不要放行。
    quiet: true
  when: ansible_facts['distribution'] == 'Ubuntu'

- name: 探測 PPA 是否有本機 codename 的 dist（Ubuntu）
  ansible.builtin.uri:
    url: "{{ php_ondrej_uri }}/dists/{{ php_ppa_suite }}/Release"
    method: HEAD
    timeout: 20
    status_code: [200]
  register: php_ppa_probe
  changed_when: false
  failed_when: false
  # check_mode: false 是必要的，和上面 gpg 指紋那一個同理。
  # --check 之下 uri 預設被跳過 → php_ppa_probe 沒有 status 欄位 →
  # 下一個 assert 的 `| default(0)` 拿到 0，於是在一台**完全正常**的機器上
  # 報「PPA 沒有為 codename noble 發佈套件（回 無回應）」。
  # 訊息指向 PPA，真正的原因是 dry-run 沒有執行探測。
  # HEAD 一個 Release 檔不改變任何狀態，在 check 模式執行它是安全的。
  check_mode: false
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - php_repo_probe | bool

- name: PPA 沒有這個 codename 時 fail fast（Ubuntu）
  ansible.builtin.assert:
    that:
      - php_ppa_probe.status | default(0) | int == 200
    fail_msg: >-
      ondrej/php PPA 沒有為 codename "{{ php_ppa_suite }}" 發佈套件
      （HEAD {{ php_ondrej_uri }}/dists/{{ php_ppa_suite }}/Release
      回 {{ php_ppa_probe.status | default('無回應') }}）。
      2026-09-03 實測：jammy 與 noble 回 200，resolute（26.04）回 404。
      三選一：
      (1) 目標機用 Ubuntu 24.04 LTS (noble) —— 本專案的預設目標；
      (2) 等 PPA 支援該 codename 再部署；
      (3) 明確承擔風險：設 php_ppa_suite=noble 借用 24.04 的套件
          （不保證可用，glibc / ABI 可能不相容，務必先在 staging 驗證）。
    quiet: true
  when:
    - ansible_facts['distribution'] == 'Ubuntu'
    - php_repo_probe | bool

- name: 設定 ondrej/php APT 來源（Ubuntu）
  ansible.builtin.deb822_repository:
    name: ondrej-php
    types: [deb]
    uris: "{{ php_ondrej_uri }}"
    suites: ["{{ php_ppa_suite }}"]
    components: [main]
    architectures: ["{{ php_repo_architectures }}"]
    signed_by: "{{ php_ondrej_keyring }}"
    enabled: true
    state: present
  register: php_repo_ubuntu
  when: ansible_facts['distribution'] == 'Ubuntu'

# ============================================================================
# Debian → packages.sury.org
# ============================================================================
- name: 下載 sury.org 簽章金鑰（Debian）
  ansible.builtin.get_url:
    url: "{{ php_sury_key_url }}"
    dest: "{{ php_sury_keyring }}"     # 二進位 keyring，副檔名必須是 .gpg
    owner: root
    group: root
    mode: "0644"
    force: false
    timeout: 30
  when: ansible_facts['distribution'] == 'Debian'

- name: 讀出 sury 金鑰指紋（Debian）
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      gpg --batch --no-tty --show-keys --with-colons {{ php_sury_keyring | quote }}
      | awk -F: '$1 == "fpr" { print $10 }'
    executable: /bin/bash
  # ⚠ check_mode: false + failed_when: false 是一組的，缺一不可。
  #
  # --check 之下 shell/command 預設會被**跳過**，register 出來的物件沒有
  # stdout_lines，於是下一個 assert 參照到未定義的欄位而失敗 ——
  # `cx deploy check` 在一台全新機器上因此必然紅燈，而訊息完全指向錯誤的方向。
  #
  # 讀取金鑰指紋不改變任何狀態，在 check 模式真的執行它是安全的。
  # 但全新機器上 keyring 還不存在（get_url 在 check 模式被跳過），
  # gpg 會失敗 —— 所以 failed_when: false，改由下面的 assert 用
  # 「有沒有讀到東西」來決定要不要比對。
  # mysql role 早就是這個模式，這裡補齊。
  register: php_sury_fpr
  failed_when: false
  check_mode: false
  changed_when: false
  when: ansible_facts['distribution'] == 'Debian'

- name: 驗證 sury 金鑰指紋（Debian）
  ansible.builtin.assert:
    that:
      - php_sury_key_fingerprint in (php_sury_fpr.stdout_lines | default([]))
    fail_msg: >-
      {{ php_sury_keyring }} 的指紋不是預期的 {{ php_sury_key_fingerprint }}
      （實際讀到：{{ php_sury_fpr.stdout_lines | join(', ') | default('（空）', true) }}）。
      預期值為 DEB.SURY.ORG Automatic Signing Key <deb@sury.org>，2026-09-03 實測。
    quiet: true
  when: ansible_facts['distribution'] == 'Debian'

- name: 探測 sury 是否有本機 codename 的 dist（Debian）
  ansible.builtin.uri:
    url: "{{ php_sury_uri }}dists/{{ php_sury_suite }}/Release"
    method: HEAD
    timeout: 20
    status_code: [200]
  register: php_sury_probe
  changed_when: false
  # changed_when: false 已宣告本 task 是唯讀查詢，那就必須在 --check 下也真的執行。
  # 少了 check_mode: false，ansible 會跳過它，register 出來的變數沒有 stdout/status，
  # 下游的 assert / set_fact 就會拿到 default 值並報出**指向錯誤方向**的訊息
  #（實測：php8.5 明明裝好了，cx deploy check 卻說「APT 來源找不到 php8.5-fpm」）。
  check_mode: false
  failed_when: false
  when:
    - ansible_facts['distribution'] == 'Debian'
    - php_repo_probe | bool

- name: sury 沒有這個 codename 時 fail fast（Debian）
  ansible.builtin.assert:
    that:
      - php_sury_probe.status | default(0) | int == 200
    fail_msg: >-
      packages.sury.org 沒有為 codename "{{ php_sury_suite }}" 發佈套件
      （HEAD {{ php_sury_uri }}dists/{{ php_sury_suite }}/Release
      回 {{ php_sury_probe.status | default('無回應') }}）。
      2026-09-03 實測：bookworm 與 trixie 回 200，forky 回 404。
      請改用受支援的 Debian 版本，或明確設定 php_sury_suite 借用較舊的 codename
      （需自行承擔 ABI 風險）。
    quiet: true
  when:
    - ansible_facts['distribution'] == 'Debian'
    - php_repo_probe | bool

- name: 設定 sury.org APT 來源（Debian）
  ansible.builtin.deb822_repository:
    name: sury-php
    types: [deb]
    uris: "{{ php_sury_uri }}"
    suites: ["{{ php_sury_suite }}"]
    components: [main]
    architectures: ["{{ php_repo_architectures }}"]
    signed_by: "{{ php_sury_keyring }}"
    enabled: true
    state: present
  register: php_repo_debian
  when: ansible_facts['distribution'] == 'Debian'

- name: 來源有變動時更新 APT 快取
  ansible.builtin.apt:
    update_cache: true
  when: >-
    (php_repo_ubuntu.changed | default(false)) or
    (php_repo_debian.changed | default(false))

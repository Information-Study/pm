---
# 這些檢查刻意放在「裝任何東西之前」：訊息才對得上原因，
# 也不會在 apt 裝完 certbot 之後才發現網域是空的。

- name: certbot | app_domain 必填且不能是佔位值
  ansible.builtin.assert:
    that:
      - (app_domain | default('') | trim | length) > 0
      - app_domain is match('^(?!-)[A-Za-z0-9-]{1,63}(?<!-)(\.(?!-)[A-Za-z0-9-]{1,63}(?<!-))+$')
      - app_domain not in ['example.com', 'localhost', 'changeme.example.com']
    quiet: true
    fail_msg: >-
      app_domain =「{{ app_domain | default('') }}」不是有效的網域。
      Let's Encrypt 只簽發公開可解析的網域，不接受 IP、localhost、.local、
      也不接受未註冊的內部名稱。
      修正：在 group_vars/{{ app_env | default('production') }}.yml 設 app_domain: your-domain.tld，
      或在純內網環境設 tls_enable: false（nginx 會用 snakeoil 自簽憑證）。

- name: certbot | certbot_email 必填（到期通知的唯一管道）
  ansible.builtin.assert:
    that:
      - (certbot_email | default('') | trim | length) > 0
      - certbot_email is match('^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$')
    quiet: true
    fail_msg: >-
      certbot_email =「{{ certbot_email | default('') }}」不是有效的 email。
      為什麼一定要有：Let's Encrypt 憑證只有 90 天，續期完全靠 systemd timer。
      timer 一旦壞掉（DNS 改了、80 埠被防火牆擋了、webroot 權限變了），
      沒有任何人會發現，直到某天憑證過期、瀏覽器對所有訪客顯示
      NET::ERR_CERT_DATE_INVALID。這個 email 是 LE 在到期前 20/10/1 天
      主動寄通知的唯一管道，也是註冊 ACME 帳號的必要欄位。
      修正：在 group_vars/{{ app_env | default('production') }}.yml 設
            certbot_email: ops@your-domain.tld
      （建議用群組信箱或 alias，不要用會離職的個人信箱。）

- name: certbot | 網域清單不可為空、不可含萬用字元
  ansible.builtin.assert:
    that:
      - (certbot_domains | default([]) | length) > 0
      - certbot_domains | select('match', '^\*\.') | list | length == 0
      - certbot_domains | unique | length == certbot_domains | length
    quiet: true
    fail_msg: >-
      certbot_domains = {{ certbot_domains | default([]) | join(', ') }}。
      * 空清單：檢查 app_domain 與 nginx_server_aliases。
      * 含萬用字元（*.example.com）：webroot 模式做不到。萬用字元憑證只能用
        DNS-01 驗證（--preferred-challenges dns + DNS 供應商 plugin），
        本 role 刻意不支援 —— 那需要把 DNS API 金鑰放上機器，是另一個安全決策。
        請改成逐一列出子網域。
      * 重複項目：certbot 會把重複的 -d 視為不同 SAN 順序而觸發不必要的重簽。

- name: certbot | 網域數量提醒（LE 單張憑證上限 100 個 SAN）
  ansible.builtin.assert:
    that:
      - (certbot_domains | length) <= 100
    quiet: true
    fail_msg: >-
      certbot_domains 有 {{ certbot_domains | length }} 個網域，超過 Let's Encrypt
      單張憑證 100 個 SAN 的上限。請拆成多張憑證（多個 --cert-name）。

- name: certbot | webroot 必須是絕對路徑，且與 nginx role 同值
  ansible.builtin.assert:
    that:
      - certbot_webroot is match('^/')
      - certbot_webroot not in ['/', '/etc', '/var', '/usr', '/srv']
    quiet: true
    fail_msg: >-
      certbot_webroot =「{{ certbot_webroot }}」不合法。
      這個值必須跟 roles/nginx_myguard/defaults/main.yml 的同名變數完全一致 ——
      nginx 的 location /.well-known/acme-challenge/ 就是 root 到它。
      兩邊不一致時 certbot 會把 challenge 檔寫到 A，nginx 從 B 找，
      驗證固定失敗並回報 404（見 issue.yml 的原因[2]）。

- name: certbot | key_type 與續期窗口
  ansible.builtin.assert:
    that:
      - certbot_key_type in ['ecdsa', 'rsa']
      - (certbot_renew_before_days | int) >= 1
      - (certbot_renew_before_days | int) <= 80
    quiet: true
    fail_msg: >-
      certbot_key_type={{ certbot_key_type }}（只能是 ecdsa 或 rsa）、
      certbot_renew_before_days={{ certbot_renew_before_days }}（必須在 1..80）。
      LE 憑證效期 90 天，續期窗口設超過 80 天等於「每次執行都重簽」，
      幾天內就會撞上 rate limit（同一組網域每週 5 張）。

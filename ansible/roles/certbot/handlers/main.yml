---
# handler 的執行順序 = 本檔的「定義順序」，跟 notify 的先後無關。
# 兩個 handler 都 listen 同一個事件，所以「憑證真的換了」時會依序跑完：
#   nginx -t → reload
#
# ── 為什麼不直接 notify nginx_myguard 的 "nginx reload" ──────────────────────
# handler 的執行順序是「整個 play 裡 handler 的定義順序」，而 nginx_myguard 的
# handler 定義在本 role 之前。notify 它的話，reload 會在「重新渲染 vhost」之前
# 就被沖掉 —— 等於拿著還指向 snakeoil 的舊設定 reload，憑證換了也沒生效。
# 所以本 role 自己帶一組 test + reload。
#
# ── 重新渲染 vhost 為什麼不在這裡 ───────────────────────────────────────────
# 原本這裡還有兩個用 include_role 重新渲染 vhost 的 handler。
# ansible-core 2.21 拒絕載入：
#   [ERROR]: Using 'ansible.builtin.include_role' as a handler is not supported.
# 已改成一般 task，見 tasks/rerender_nginx.yml（由 tasks/main.yml 在
# issue.yml 之後、flush_handlers 之前呼叫）。

# A12：不加 -c。-c 會把片段當成完整主設定，沒有 events{} 就 emerg。
- name: certbot | 驗證 nginx 設定
  ansible.builtin.command:
    argv:
      - "{{ nginx_binary }}"
      - "-t"
  register: certbot_handler_nginx_test
  changed_when: false
  failed_when: certbot_handler_nginx_test.rc != 0
  check_mode: false
  listen: certbot cert changed

- name: certbot | 重載 nginx
  ansible.builtin.systemd_service:
    name: "{{ nginx_service_name }}"
    state: reloaded
  listen: certbot cert changed

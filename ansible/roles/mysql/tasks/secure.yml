---
# roles/mysql/tasks/secure.yml —— root 密碼與帳號清理
# 所有 ansible.mysql 任務都走 unix socket + /root/.my.cnf，
# 不把密碼放進 task 參數（A18：.my.cnf 已於 install.yml 第一步寫好）。

- name: 確認 /root/.my.cnf 已就位（A18 的前提）
  ansible.builtin.stat:
    path: "{{ mysql_defaults_file }}"
  register: mysql_defaults_stat

- name: /root/.my.cnf 不存在就中止（沒有它，改完密碼會把自己鎖在門外）
  ansible.builtin.assert:
    that:
      - mysql_defaults_stat.stat.exists
    fail_msg: >-
      {{ mysql_defaults_file }} 不存在。請先執行 --tags mysql_install
      （它的第一個任務就是寫這個檔）。
    quiet: true

- name: 等待 MySQL socket 就緒
  ansible.builtin.wait_for:
    path: "{{ mysql_socket }}"
    state: present
    timeout: 90

- name: 設定 root@localhost 密碼（A18：只做 localhost，不用 host_all）
  # host_all 不能與「建立/更新使用者」併用（模組只允許用於 state=absent），
  # 而且對 root 用 host_all 會把 root@localhost 一起改掉／刪掉。
  ansible.mysql.mysql_user:
    # ⚠ 用 plugin + plugin_auth_string，不能用 password。
    #
    # ansible.mysql.mysql_user 在收到 `password:` 時的邏輯是
    # （modules/mysql_user.py 第 227-235 行）：
    #   如果伺服器「支援」mysql_native_password → 用 SHA1 自己算 hash，
    #   再送 IDENTIFIED WITH mysql_native_password AS <hash>
    # 而它的「支援」判斷是看版本（< 9.7.0 就算支援），不是看外掛有沒有載入。
    #
    # MySQL 8.4 把 mysql_native_password 從預設建置移除（外掛還在，但預設不載入），
    # 於是這條路必定失敗：
    #   (1524, "Plugin 'mysql_native_password' is not loaded")
    # 而且 no_log: true 會把這個訊息整個遮掉，只看得到 "changed": false。
    # 2026-09-04 在真實的 MySQL 8.4.11 上實測，連建立一個全新使用者都會失敗。
    #
    # 同一個模組的第 236-238 行顯示：同時給 plugin 與 plugin_auth_string 時
    # 會走 `IDENTIFIED WITH <plugin> BY <auth>`，完全繞過 native password。
    # 實測建立成功、實際登入通過、root 改密碼也可以。
    name: root
    host: localhost
    plugin: "{{ mysql_auth_plugin }}"
    plugin_auth_string: "{{ mysql_root_password }}"
    update_password: "{{ mysql_root_password_update }}"
    state: present
    login_unix_socket: "{{ mysql_socket }}"
    config_file: "{{ mysql_defaults_file }}"
  no_log: true

- name: 移除匿名帳號（gate：mysql_remove_anonymous_users）
  # host_all 在這裡是合法的：它只搭配 state=absent 使用。
  ansible.mysql.mysql_user:
    name: ""
    host_all: true
    state: absent
    login_unix_socket: "{{ mysql_socket }}"
    config_file: "{{ mysql_defaults_file }}"
  when: mysql_remove_anonymous_users | bool

- name: 查出非 localhost 的 root 帳號
  ansible.mysql.mysql_query:
    query: "SELECT host FROM mysql.user WHERE user = 'root' AND host <> 'localhost'"
    login_db: mysql
    login_unix_socket: "{{ mysql_socket }}"
    config_file: "{{ mysql_defaults_file }}"
  register: mysql_remote_root
  changed_when: false
  # changed_when: false 已宣告本 task 是唯讀查詢，那就必須在 --check 下也真的執行。
  # 少了 check_mode: false，ansible 會跳過它，register 出來的變數沒有 stdout/status，
  # 下游的 assert / set_fact 就會拿到 default 值並報出**指向錯誤方向**的訊息
  #（實測：php8.5 明明裝好了，cx deploy check 卻說「APT 來源找不到 php8.5-fpm」）。
  check_mode: false
  when: mysql_remove_remote_root | bool

- name: 移除非 localhost 的 root 帳號（gate：mysql_remove_remote_root）
  ansible.mysql.mysql_user:
    name: root
    host: "{{ item.host }}"
    state: absent
    login_unix_socket: "{{ mysql_socket }}"
    config_file: "{{ mysql_defaults_file }}"
  loop: "{{ mysql_remote_root.query_result[0] | default([]) }}"
  loop_control:
    label: "root@{{ item.host }}"
  when:
    - mysql_remove_remote_root | bool
    - mysql_remote_root.query_result is defined

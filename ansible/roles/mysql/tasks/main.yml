---
# roles/mysql/tasks/main.yml
# 流程：assert → repo → install → config → secure → databases → backup → verify
# 順序是刻意的：
#   * repo 在 install 之前（A4：發行版拿不到 8.4 LTS）
#   * /root/.my.cnf 在 install 之前寫（A18，見 install.yml 第一個任務）
#   * verify 在最後，實際用應用帳號從 127.0.0.1 連一次（A3 的真實驗證）

- name: 前置檢查
  ansible.builtin.import_tasks: assert.yml
  tags: [mysql, mysql-assert]

- name: 設定 Oracle MySQL APT 來源
  ansible.builtin.import_tasks: repo.yml
  when: mysql_repo_source == 'oracle'
  tags: [mysql, mysql-repo]

- name: 安裝 MySQL
  ansible.builtin.import_tasks: install.yml
  tags: [mysql, mysql-install]

- name: 寫入伺服器設定
  ansible.builtin.import_tasks: config.yml
  when: mysql_installed_ok | default(false) | bool
  tags: [mysql, mysql-config]

- name: root 帳號與安全強化
  ansible.builtin.import_tasks: secure.yml
  when: mysql_installed_ok | default(false) | bool
  tags: [mysql, mysql-secure]

- name: 應用程式資料庫與帳號
  ansible.builtin.import_tasks: databases.yml
  when: mysql_installed_ok | default(false) | bool
  tags: [mysql, mysql-db]

- name: 備份腳本與排程
  ansible.builtin.import_tasks: backup.yml
  tags: [mysql, mysql-backup]

# ⚠ verify.yml 讀的是 MySQL 的「執行期」設定（SHOW VARIABLES），
# 所以必須在 restart handler 真的跑完之後才有意義。
#
# handler 預設要等到整個 play 結束才執行，而 verify 就在同一個 role 裡 ——
# 於是第一次部署時它驗到的是「重啟前」的狀態，必定失敗：
#   collation=utf8mb4_0900_ai_ci（預期 utf8mb4_unicode_ci）
#   skip_name_resolve=0
# 而 zz-app.cnf 明明已經寫好、!includedir 也正確，訊息卻把人導向去查設定檔路徑。
# 2026-09-04 在真實主機上實測踩到（178 個 task 之後才浮現）。
#
# certbot role 早就用了同樣的手法（它的 verify 也要讀 nginx 實際載入的設定）。
- name: 套用設定變更（verify 之前必須先讓 restart handler 跑完）
  ansible.builtin.meta: flush_handlers
  tags: [mysql, mysql-verify]

- name: 驗證
  ansible.builtin.import_tasks: verify.yml
  when: mysql_installed_ok | default(false) | bool
  tags: [mysql, mysql-verify]

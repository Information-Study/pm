---
# roles/mysql/tasks/backup.yml —— mysqldump + cron
# 清理舊備份用 find -maxdepth 1 -type f -name '<prefix>-*' -mtime +N -delete，
# 作用範圍被目錄、深度、檔名樣式三重限制住；腳本內另有絕對路徑與
# 保留天數的執行期檢查。任何情況都不會出現無界的遞迴刪除。

- name: 建立備份目錄
  ansible.builtin.file:
    path: "{{ mysql_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ⚠ mysql_backup_log 預設落在 /var/log/{{ app_slug }}，而那個目錄是 common role
#   建的（deploy:web_group 0750），nodejs_pm2 也會確保它存在。三個 role 搶同一個
#   目錄的話，每次執行都會互相把 owner/group/mode 改回自己要的值 ——
#   實測 mysql（root:adm 0750）與 nodejs_pm2（deploy:www-data 0750）
#   會在每一次部署互相翻轉。
#
#   所以這裡只負責「不存在就建出來」（讓 mysql role 單獨使用時仍然可用），
#   已經存在就完全不碰屬性 —— 目錄的擁有者是 common role，不是這裡。
- name: 備份 | 探測記錄檔目錄是否已存在
  ansible.builtin.stat:
    path: "{{ mysql_backup_log | dirname }}"
  register: mysql_backup_log_dir

- name: 備份 | 目錄不存在才建立（存在就不碰屬性，避免與 common/nodejs_pm2 互搶）
  ansible.builtin.file:
    path: "{{ mysql_backup_log | dirname }}"
    state: directory
    owner: root
    group: adm
    mode: "0750"
  when: not mysql_backup_log_dir.stat.exists

- name: 安裝備份腳本
  ansible.builtin.template:
    src: mysql-backup.sh.j2
    dest: "{{ mysql_backup_script }}"
    owner: root
    group: root
    mode: "0750"

- name: 檢查備份腳本語法
  ansible.builtin.command:
    argv: [bash, -n, "{{ mysql_backup_script }}"]
  register: mysql_backup_syntax
  changed_when: false
  failed_when: mysql_backup_syntax.rc != 0
  check_mode: false
  when: not ansible_check_mode

- name: 設定備份排程（gate：mysql_backup_enabled）
  ansible.builtin.cron:
    name: "{{ app_slug | default('pm') }} mysql backup"
    user: root
    cron_file: "{{ app_slug | default('pm') }}-mysql-backup"
    minute: "{{ mysql_backup_minute }}"
    hour: "{{ mysql_backup_hour }}"
    job: "{{ mysql_backup_script }} >> {{ mysql_backup_log }} 2>&1"
    state: "{{ (mysql_backup_enabled | bool) | ternary('present', 'absent') }}"

- name: 設定備份記錄輪替
  ansible.builtin.template:
    src: logrotate-mysql-backup.j2
    dest: "/etc/logrotate.d/{{ app_slug | default('pm') }}-mysql-backup"
    owner: root
    group: root
    mode: "0644"
  when: mysql_backup_logrotate | bool

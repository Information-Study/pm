---
# A17：deb822_repository 需要 2.15、systemd_service 需要 2.17 → 下限 2.17。
- name: 斷言 | ansible-core 版本
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.17', '>=')
    quiet: true
    fail_msg: >-
      需要 ansible-core >= 2.17（目前 {{ ansible_version.full }}）。
      另外請確認 ansible.cfg 的 collections_path 有把 ~/.ansible/collections 列回搜尋路徑，
      只寫 ./collections 會「取代」而不是「附加」預設路徑。

- name: 斷言 | 平台
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
      - ansible_facts['distribution_release'] | default('') | length > 0
    quiet: true
    fail_msg: >-
      本 role 只支援 Debian 系（Ubuntu 24.04 noble 為預設目標）。
      目前 os_family={{ ansible_facts['os_family'] | default('（facts 未收集）') }}。

- name: 斷言 | 網域與核心變數
  ansible.builtin.assert:
    that:
      - app_domain | length > 0
      - app_domain is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$')
      - app_slug is match('^[a-z][a-z0-9_-]{1,31}$')
      - backend_current_path is match('^/..*')
      - nginx_server_names | length > 0
    quiet: true
    fail_msg: >-
      app_domain =「{{ app_domain | default('<未定義>') }}」不是合法網域。
      vhost 的 server_name、TLS 憑證路徑、certbot 的 --cert-name 都靠它，
      不能留空或用 example.com 之類的佔位值（preflight 也會擋）。

- name: 斷言 | 前端模式與實例數（A10 / A20）
  ansible.builtin.assert:
    that:
      - frontend_mode in ['ssr', 'spa', 'static']
      - (frontend_instances | int) >= 1
      - (frontend_instances | int) <= 32
      - (frontend_port | int) > 0
    quiet: true
    fail_msg: >-
      frontend_mode 必須是 ssr / spa / static（目前 {{ frontend_mode | default('<未定義>') }}），
      frontend_instances 必須是 1..32 的明確數字（目前 {{ frontend_instances | default('<未定義>') }}）。
      A10：PM2 一律 fork，水平擴充是開 N 個 fork 綁 {{ frontend_port | default(3000) }}..+N-1，
      upstream 用 least_conn 分流。絕不可用 'max'（容器/cgroup 下 CPU 數會被誤讀）。

# A16：四個值必須從 app_max_upload_mb 推導，且大小順序必須正確。
# preflight/tasks/uploads.yml 會用同一組公式再驗一次；兩邊的加成值必須一致。
- name: 斷言 | 上傳限制的大小順序（A16）
  ansible.builtin.assert:
    that:
      - (nginx_client_max_body_size | human_to_bytes) > 0
      - (nginx_client_max_body_size | human_to_bytes) >= (php_post_max_size | human_to_bytes)
      - (waf_request_body_limit | human_to_bytes) > (nginx_client_max_body_size | human_to_bytes)
      - (waf_request_body_limit | human_to_bytes) <= 1073741824
    quiet: true
    fail_msg: >-
      上傳限制順序不對（bytes）：
      php_post_max_size={{ php_post_max_size | human_to_bytes }}、
      nginx_client_max_body_size={{ nginx_client_max_body_size | human_to_bytes }}、
      waf_request_body_limit={{ waf_request_body_limit | human_to_bytes }}。
      必須是 php_post <= nginx_body < waf_body <= 1GiB。
      正確做法是全部從 app_max_upload_mb({{ app_max_upload_mb }}) 推導：
      nginx = app+{{ app_upload_nginx_overhead_mb }}m、waf = (app+{{ app_upload_waf_overhead_mb }})*1048576 bytes。
      順序錯的話，{{ app_max_upload_mb }}MB 附近的上傳會過了 nginx 和 PHP 才被 WAF 擋成 413。

- name: 斷言 | 本地 WAF 規則 ID 不重複且落在本地保留範圍
  ansible.builtin.assert:
    that:
      - waf_local_ids | length == (waf_local_ids | unique | length)
      - waf_local_ids | min >= 1
      - waf_local_ids | max <= 99999
    quiet: true
    fail_msg: >-
      本地規則 ID 有重複或超出範圍：{{ waf_local_ids }}。
      ModSecurity 遇到重複 id 會拒絕載入整份設定。
      CRS 保留 900000 以上，1–99999 才是本地規則的範圍。
  vars:
    waf_local_ids: >-
      {{ [waf_local_rule_id_base | int]
         + (waf_exclusions_before | map(attribute='id') | map('int') | list) }}
  when: waf_enabled | bool

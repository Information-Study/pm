---
# 名稱刻意跟 php role 的 handler 不同。Ansible 的 notify 是「全域名稱比對」，
# 撞名會讓兩個 role 的 handler 一起被觸發。
#
# 這裡只留兩個。queue worker 的重啟不是 handler 而是 services.yml 裡的顯式任務 ——
# 它必須在「換版之後」才跑，用 handler 無法保證這個順序。
- name: deploy_backend | reload php-fpm
  ansible.builtin.systemd_service:
    name: "{{ php_fpm_service }}"
    state: reloaded
  when:
    - backend_reload_php_fpm | bool
    - backend_php_fpm_unit_present | default(false) | bool

- name: deploy_backend | daemon-reload
  ansible.builtin.systemd_service:
    daemon_reload: true

---
# 後面所有 pm2 任務都要 become_user 到 {{ deploy_user }}。root → 非特權使用者的
# become 需要 setfacl 才能把 Ansible 的暫存檔交出去，沒有 acl 會得到
#   "Failed to set permissions on the temporary files Ansible needs to create...
#    Enable ACLs or set allow_world_readable_tmpfiles"
- name: 安裝 acl（become_user 需要）
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
    cache_valid_time: 3600

# ---- A9 的同型問題：PM2 要寫的目錄全部先明確建好 ---------------------------
- name: 建立 PM2 需要的目錄
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    # PM2_HOME：pm2 daemon 的 socket、pid、dump.pm2 都在這裡
    - path: "{{ pm2_home }}"
      owner: "{{ deploy_user }}"
      group: "{{ deploy_group }}"
      mode: "0750"
    # PM2 的 out/err 由 deploy 身分的行程直接寫入。
    # 屬性刻意跟 common 的 common_log_directories 一致（deploy:web_group 0770），
    # 否則兩個 role 每次執行都會互相翻對方的 owner / mode。
    - path: "{{ app_log_dir }}"
      owner: "{{ deploy_user }}"
      group: "{{ web_group }}"
      mode: "0770"
    # ecosystem 放在 shared/ 底下，換版不會被覆蓋。
    # common 已經建好父層 {{ app_shared_dir }}（02750 deploy:web_group），
    # 這裡只補 pm2/ 子目錄，沿用同樣的 setgid 模式。
    - path: "{{ pm2_ecosystem_dir }}"
      owner: "{{ deploy_user }}"
      group: "{{ web_group }}"
      mode: "02750"
  loop_control:
    label: "{{ item.path }}"

- name: 讀取目前的 PM2 版本
  ansible.builtin.command:
    argv: ["{{ pm2_bin }}", "--version"]
  register: pm2_installed
  changed_when: false
  # changed_when: false 已宣告本 task 是唯讀查詢，那就必須在 --check 下也真的執行。
  # 少了 check_mode: false，ansible 會跳過它，register 出來的變數沒有 stdout/status，
  # 下游的 assert / set_fact 就會拿到 default 值並報出**指向錯誤方向**的訊息
  #（實測：php8.5 明明裝好了，cx deploy check 卻說「APT 來源找不到 php8.5-fpm」）。
  check_mode: false
  failed_when: false

- name: 安裝 / 對齊 PM2 版本
  ansible.builtin.command:
    argv:
      - "{{ npm_bin }}"
      - install
      - "-g"
      - "--no-fund"
      - "--no-audit"
      - "pm2@{{ pm2_version }}"
  register: pm2_npm_install
  changed_when: pm2_npm_install.rc == 0
  failed_when: pm2_npm_install.rc != 0
  when: pm2_version not in (pm2_installed.stdout | default('') | trim)

- name: 確認 pm2 執行檔位置
  ansible.builtin.stat:
    path: "{{ pm2_bin }}"
  register: pm2_bin_stat

- name: pm2 執行檔不在預期位置時 fail fast
  ansible.builtin.assert:
    that:
      - pm2_bin_stat.stat.exists
    fail_msg: >-
      npm 全域安裝完成，但 {{ pm2_bin }} 不存在。
      NodeSource 的 nodejs 套件把 npm prefix 設在 /usr（模組在 /usr/lib/node_modules，
      執行檔 symlink 到 /usr/bin）。若這台機器改過 prefix，
      請執行 `npm prefix -g` 找出實際位置，再設定 pm2_bin 變數。
    quiet: true

# `pm2 startup` 以 root 執行時會直接寫出 unit 檔並 enable，不只是印指令。
# PM2_HOME 刻意指到 /root/.pm2：不讓 root 的 pm2 client 在 deploy 的 PM2_HOME
# 底下留下 root 屬主的檔案（那會讓之後 deploy 身分的 pm2 完全連不上 daemon）。
# unit 內的 PM2_HOME 由 --hp 決定，也就是 {{ deploy_user_home }}/.pm2。
- name: 安裝 PM2 的 systemd 開機單元
  ansible.builtin.command:
    argv:
      - "{{ pm2_bin }}"
      - startup
      - systemd
      - "-u"
      - "{{ deploy_user }}"
      - "--hp"
      - "{{ deploy_user_home }}"
    creates: "/etc/systemd/system/{{ pm2_systemd_unit }}.service"
  environment:
    PM2_HOME: /root/.pm2
    HOME: /root
  register: pm2_startup
  # ⚠ creates: 命中時 command 模組回的是 rc=0 + stdout "skipped, since ... exists"，
  #   **不是** task 層級的 skip —— 所以 changed_when 照樣會被求值。
  #   原本只寫 `rc == 0`，於是「什麼都沒做」也一律回報 changed，永遠不冪等。
  changed_when:
    - (pm2_startup.rc | default(0)) == 0
    - "'skipped, since' not in (pm2_startup.stdout | default(''))"
  failed_when: (pm2_startup.rc | default(0)) != 0

- name: 確認 systemd unit 已產生
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ pm2_systemd_unit }}.service"
  register: pm2_unit_stat

- name: systemd unit 未產生時 fail fast
  ansible.builtin.assert:
    that:
      - pm2_unit_stat.stat.exists
    fail_msg: >-
      /etc/systemd/system/{{ pm2_systemd_unit }}.service 不存在。
      `pm2 startup systemd -u {{ deploy_user }} --hp {{ deploy_user_home }}` 的輸出：
      {{ pm2_startup.stdout | default('（本次因 creates 而略過）') | trim }}
      {{ pm2_startup.stderr | default('') | trim }}
    quiet: true

# ── 修正 pm2 startup 產生的 unit（PM2 v7）─────────────────────────────────
# `pm2 startup systemd` 產生的單元是 Type=forking + PIDFile=$PM2_HOME/pm2.pid，
# 但 PM2 v7 的 God Daemon **不會**寫那個檔（實測 v7.0.4：daemon 明明在跑，
# $PM2_HOME 底下只有 pids/ 目錄，沒有 pm2.pid）。
# 於是只要 daemon 是被部署流程的 `pm2 startOrReload` 先起來的，systemd 就會說
#   Can't open PID file /home/deploy/.pm2/pm2.pid (yet?) after start
#   pm2-deploy.service: Failed with result 'protocol'
# 並在 Restart= 之下重試到 "Start request repeated too quickly"。
#
# 改成 oneshot + RemainAfterExit：ExecStart 只負責把 dump resurrect 回來，
# 跑完就結束，daemon 的存活由 PM2 自己負責（healthcheck 另外驗 process 清單）。
# 用 drop-in 而不是改 unit 本體 —— 下次 `pm2 startup` 重新產生時不會被蓋掉。
# 2026-09-04 對真實目標實測踩到。
- name: 建立 PM2 systemd drop-in 目錄
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ pm2_systemd_unit }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 修正 PM2 unit 的 Type / PIDFile（PM2 v7 不寫 pm2.pid）
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ pm2_systemd_unit }}.service.d/10-{{ app_slug }}.conf"
    owner: root
    group: root
    mode: "0644"
    content: |
      # {{ ansible_managed }}
      # PM2 v7 的 God Daemon 不寫 $PM2_HOME/pm2.pid，
      # 但 `pm2 startup` 產生的 unit 仍然是 Type=forking + PIDFile。
      # 結果是 systemd 每次都判定 protocol 失敗，即使 daemon 明明在跑。
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      PIDFile=
      Restart=no

# 不寫成 handler：drop-in 必須在同一個 play 稍後的 deploy_frontend
#（它會 systemctl start 這個單元）之前就生效，而 handler 要等 play 結束。
# 也不寫 when: ... is changed —— 那正是 ansible-lint 的 no-handler 規則在抓的形狀，
# 而 daemon-reload 本來就是冪等的、成本極低。
- name: 重新載入 systemd（讓 drop-in 生效）
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false

# 註：這裡刻意沒有 logrotate 任務。
# common role 的 /etc/logrotate.d/{{ app_slug }} 已經涵蓋 {{ app_log_dir }}/*.log，
# 再寫一份會讓 logrotate 報 "duplicate log entry"，
# 而 common 的 `logrotate --debug` 驗證會讓 play 失敗。

---
# 安裝：
#   cd ansible && ansible-galaxy collection install -r requirements.yml
#
# A17：ansible.cfg 的 collections_path 已把 ~/.ansible/collections 列回搜尋路徑，
# 所以用預設安裝位置即可；若你要裝進 repo 內的 ./collections（已被 .gitignore 排除），
# 加 -p ./collections 也一樣找得到。
#
# 版本下限的理由：
#   ansible.posix     — authorized_key / sysctl / mount
#   community.general — ufw / timezone / locale_gen
#   ansible.mysql     — mysql_user / mysql_db / mysql_query（mysql role 用）。
#                       原本寫 community.mysql；那個 collection 從 5.x 起只是一層
#                       redirect，實作已搬到 ansible.mysql，ansible-lint 的
#                       fqcn[canonical] 會要求用正規名稱。
#   community.crypto  — 自簽憑證 / TLS 相關輔助（nginx + certbot role 用）
collections:
  - name: ansible.posix
    version: ">=1.5.4"
  - name: community.general
    version: ">=9.0.0"
  - name: ansible.mysql
    version: ">=5.0.0"
  - name: community.crypto
    version: ">=2.20.0"

roles: []

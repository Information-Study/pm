# ── edge vhost：前後端分流 ──────────────────────────────────────────────────
#
# /                                      → Nuxt (nuxt:3000)
# /api /admin /up /storage /sanctum      → PHP  (app:8080)
# /livewire-<hash>/                      → PHP（Filament v5 的前端全靠它）
# /js /css /fonts /vendor /build         → PHP（Laravel 發布的靜態資產）
#
# 這個拓撲與 Ansible 原生部署刻意保持一致（claude.md §6），
# 所以 NUXT_PUBLIC_API_BASE_URL="" （同源）在兩邊都是正確預設。

upstream pm_php {
    server app:8080;
    keepalive 16;
}

upstream pm_nuxt {
    server nuxt:3000;
    keepalive 16;
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # edge 自己的健康檢查端點。不能用 /up ——
    # /up 會被轉給 PHP，於是 edge 的 healthcheck 實際上在測 app，
    # app 不健康時 edge 也變 unhealthy，兩個 service 一起卡住。
    location = /healthz {
        access_log off;
        # 用 default_type 而不是 add_header Content-Type：
        # nginx 的繼承規則是「當前層有 add_header 就完全不繼承上層」，
        # 在 location 裡用 add_header 會讓 server 層的安全標頭在這個路徑上全部消失。
        default_type text/plain;
        include /etc/nginx/conf.d/pm-security-headers.inc;
        return 200 "edge ok\n";
    }

    # ── PHP 側 ───────────────────────────────────────────────────────────
    # 注意順序：^~ 前綴比對優先於正規式，且比 / 更精確。
    # ⚠ 這裡刻意**不寫** `^~ /admin`。`^~` 是純前綴比對，會連 /admino 一起吃掉，
    #   而原生側的 `^/(…)(/|$)` 不會 —— 那是一個會讓前端路由在 Docker 下
    #   莫名其妙 404 的邊界差異。/admin 由下面那條帶 (/|$) 的正規式負責。
    location ^~ /api/      { include /etc/nginx/conf.d/pm-php.inc; }
    location ^~ /storage/  { include /etc/nginx/conf.d/pm-php.inc; }
    location = /up         { include /etc/nginx/conf.d/pm-php.inc; }

    # Sanctum 的 SPA 認證流程：前端要先打 /sanctum/csrf-cookie 拿 XSRF-TOKEN。
    # 漏掉這一條，登入會在第一步就 404，而症狀看起來像「CORS 壞了」。
    location ^~ /sanctum/  { include /etc/nginx/conf.d/pm-php.inc; }

    # ── Laravel 發布的靜態資產 ────────────────────────────────────────────
    # ⚠ 這一組原本沒有，Filament 後台因此在三個模式下都是壞的。
    #
    # Filament v5 的 `artisan filament:assets` 會把 CSS/JS/字型發布到
    # backend/public/{css,js,fonts}/filament/…。這些路徑原本落到 `location /`
    # 被轉給 Nuxt，於是全部 404 —— /admin/login 的 HTML 殼會回 200，
    # 但畫面上沒有任何樣式與互動，看起來像「Filament 壞了」。
    # 2026-09-04 實測：經 edge 404、直連 app 200。
    #
    # Nuxt 自己的資產全部在 /_nuxt/ 底下，不會跟這幾個前綴衝突。
    # /vendor/ 與 /build/ 是 Laravel 其他套件與 Vite 的發布位置。
    # /images/ 是 Filament 的資產路徑（asset('images/xxx.png')）——
    # 原生側 vhost.conf.j2 一直有，Docker 這邊漏了，於是後台的圖片會掉到
    # catch-all 交給 Nuxt 而 404（2026-09-05 實測）。與 /js/ /css/ 同一類。
    location ^~ /images/  { include /etc/nginx/conf.d/pm-php.inc; }
    location ^~ /js/      { include /etc/nginx/conf.d/pm-php.inc; }
    location ^~ /css/     { include /etc/nginx/conf.d/pm-php.inc; }
    location ^~ /fonts/   { include /etc/nginx/conf.d/pm-php.inc; }
    location ^~ /vendor/  { include /etc/nginx/conf.d/pm-php.inc; }
    location ^~ /build/   { include /etc/nginx/conf.d/pm-php.inc; }
    location = /favicon.ico { include /etc/nginx/conf.d/pm-php.inc; }
    location = /robots.txt  { include /etc/nginx/conf.d/pm-php.inc; }

    # ── A13：與原生部署對齊的 PHP 前綴 ───────────────────────────────────
    #
    # 上面那幾條 ^~ 是最早寫的，但清單一直比原生側少四個：
    #   /filament  /login  /logout  /broadcasting
    # 原生側的來源是 ansible/inventory/group_vars/all/main.yml 的
    # nginx_php_prefixes（/api /admin /livewire /filament /sanctum /up
    # /login /logout /broadcasting），由 vhost.conf.j2 組成一條
    # `^/(…)(/|$)` 的正規式。
    #
    # 2026-09-05 實測 Docker 側：
    #   /login                  → Nitro 的 404（"Page not found: /login"）
    #   /filament/assets/app.js → 同上
    # 也就是說它們被 catch-all 送給了 Nuxt。這正是本檔第 55-57 行那段註解
    # 描述的同一種故障（Filament 的資產被前端吃掉 → 後台沒樣式），
    # 只是當時只補了 /js/ /css/ /fonts/，沒補這四個。
    #
    # 為什麼用正規式而不是 ^~：`^~ /login` 會連 /loginfoo 一起吃掉，
    # 而原生側的 (/|$) 不會。要對齊就要連邊界一起對齊。
    # 這裡也順便補上不帶斜線的 /api 與 /sanctum（上面的 ^~ 需要尾斜線）。
    location ~ ^/(api|admin|sanctum|up|filament|login|logout|broadcasting)(/|$) {
        include /etc/nginx/conf.d/pm-php.inc;
    }

    # ── Livewire ─────────────────────────────────────────────────────────
    # ⚠ 不能寫 `location ^~ /livewire/`。
    #
    # Livewire v4（Filament v5 的底層）把端點放在**帶 hash 的前綴**底下：
    #   /livewire-e86dca9d/livewire.js
    #   /livewire-e86dca9d/update
    #   /livewire-e86dca9d/upload-file
    # hash 由應用的 key 推導，每個部署不同，所以不能寫死。
    # 用 `^~ /livewire/` 的話一條都比對不到 —— 後台的每一次互動都 404，
    # 而瀏覽器的 console 只會說 livewire.js 載不到。
    # 2026-09-04 用 `artisan route:list` 確認實際端點形狀後修正。
    #
    # 正規式 location 的優先權高於前綴 `/`，所以放在這裡就會先命中。
    # 同時保留不帶 hash 的舊形式，兩種都吃。
    location ~ ^/livewire(-[0-9a-zA-Z]+)?/ {
        include /etc/nginx/conf.d/pm-php.inc;
    }

    # ── 前端側（其餘全部）─────────────────────────────────────────────────
    # nosemgrep: nginx.security.possible-nginx-h2c-smuggling.possible-nginx-h2c-smuggling
    # Semgrep 是對「location 同時設了 Upgrade 與 Connection」這個結構告警。
    # 實際的 H2C 風險已經處理掉了：nginx.conf 的 map 只把 websocket 列入白名單，
    # Upgrade: h2c 會被轉成空字串、Connection 轉成 close。
    location / {
        proxy_pass http://pm_nuxt;
        proxy_http_version 1.1;
        # nosemgrep: nginx.security.request-host-used.request-host-used
        # 轉發 $host 是反向代理的標準作法，這裡是刻意的：
        #   * edge 是唯一入口，容器內的 app / nuxt 都沒有對外發布埠
        #   * Laravel 端已設定 TrustProxies（backend/bootstrap/app.php），
        #     而且 APP_URL / SANCTUM_STATEFUL_DOMAINS 都是明確值
        #   * 真正要收緊 Host 的地方是最前面那一層：Ansible 的 nginx_myguard
        #     有真實的 server_name（來自 app_domain），不吃未知的 Host
        # 改成寫死 Host 會讓同一份設定無法在 dev(8080) / test(18081) / prod(80) 共用。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $pm_forwarded_port;
        # HMR / Nitro 的 websocket
        # 只轉發白名單內的 Upgrade 值（見 nginx.conf 的 map）。
        # 直接轉 $http_upgrade 會把 Upgrade: h2c 也送出去 —— 那是 H2C smuggling。
        proxy_set_header Upgrade           $safe_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        # 安全標頭。nginx 的 add_header 不會繼承 —— 每個 location 都要自己帶。
        include /etc/nginx/conf.d/pm-security-headers.inc;
    }
}

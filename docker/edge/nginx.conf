# ── edge 反向代理的主設定 ───────────────────────────────────────────────────
# 官方 nginx:alpine 映像。三個模式都跑這一份。
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format edge '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout edge;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    # 必須 >= 後端 app 的 client_max_body_size（64m），否則大檔會在 edge 就被截，
    # 而 Laravel 那邊完全看不到請求，錯誤訊息會指向錯的地方。
    client_max_body_size 64m;

    # WAF 在 edge 前面（test 模式），要把真實 client IP 傳下去。
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml text/javascript image/svg+xml;

    # ── H2C smuggling 防護 ──────────────────────────────────────────────
    # 這個 map 決定要不要把 Connection: upgrade 轉給上游。
    #
    # 只寫 `default upgrade;` 是有問題的：任何 Upgrade 值都會被原封不動轉出去，
    # 包含 `Upgrade: h2c`。上游若支援明文 HTTP/2，攻擊者就能把連線升級成
    # edge 看不懂的協定，之後所有請求都繞過這一層的路由與安全標頭
    #（Semgrep 的 possible-nginx-h2c-smuggling）。
    #
    # 所以改成白名單：只有 websocket 才放行升級，其餘一律 close。
    # HMR（Vite）與 Nitro 的即時連線用的就是 websocket，功能不受影響。
    map $http_upgrade $connection_upgrade {
        default    close;
        websocket  upgrade;
    }

    # 同理，只把已知安全的 Upgrade 值傳給上游。
    map $http_upgrade $safe_upgrade {
        default    "";
        websocket  websocket;
    }

    include /etc/nginx/conf.d/*.conf;
}

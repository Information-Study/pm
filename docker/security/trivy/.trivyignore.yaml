# Trivy 的抑制清單。由 trivy.yaml 的 ignorefile: 載入。
#
# 規則：每一筆都必須有 statement（為什麼可以忽略）與 expired_at（到期日）。
# 不接受無限期抑制 —— 到期之後 Trivy 會重新回報，強迫重新評估。

misconfigurations:
  - id: DS-0002
    paths:
      - "docker/php/Dockerfile"
    statement: >-
      app 映像的 PID 1 是 supervisord，它必須以 root 執行：nginx master 要 root
      才能 bind 並把 worker 降權成 www-data，php-fpm master 同理（www.conf 的 user=）。
      真正處理請求的 worker 全部是 www-data，且 uid 已在 build 時對齊成 APP_UID。
      加上 USER 之後 supervisord 起不來 —— 這是架構決定，不是疏漏。
      Dockerfile 內對應的 nosemgrep 註解說明同一件事。
    expired_at: 2027-03-31
  - id: DS-0002
    paths:
      - "docker/nuxt/Dockerfile"
    statement: >-
      static target 用官方 nginx 映像，其 master 必須以 root 啟動才能 bind
      並把 worker 降權成 nginx 使用者。dev 與 prod 兩個 target 都已經是 USER node。
    expired_at: 2027-03-31
  - id: DS-0002
    paths:
      - "docker/ansible-target/Dockerfile"
    statement: >-
      這個映像的 PID 1 是 systemd —— 它存在的唯一目的就是當「一台真的機器」給
      Ansible 部署（systemd_service、handler、服務啟動順序都要是真的）。
      systemd 作為 PID 1 必須是 root，加 USER 之後容器根本起不來。
      它也**不對外提供服務**：只發布 127.0.0.1:2222 的 sshd 給 ansible 連，
      而且是本機驗證用的一次性目標，不會出現在任何部署裡。
      2026-09-05 補上 —— 這個目錄是後來加的，當時漏了對應的抑制條目，
      於是 cx scan sca 一直回報一個架構上不可能修的 HIGH。
    expired_at: 2027-03-31

vulnerabilities: []

secrets: []

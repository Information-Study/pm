# Trivy 祕密掃描規則調整
enable-builtin-rules:
  - aws-access-key-id
  - aws-secret-access-key
  - github-pat
  - github-oauth
  - gitlab-pat
  - private-key
  - slack-access-token
  - stripe-secret-token

allow-rules:
  - id: env-example
    description: .env.example 是刻意提交的範本，欄位皆為空值
    path: .*\.env\.example$
  - id: lockfiles
    description: lock 檔中的 integrity 雜湊不是祕密
    path: (package-lock\.json|composer\.lock)$

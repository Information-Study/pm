# ── dev overlay ─────────────────────────────────────────────────────────────
# bind mount 原始碼 + HMR + xdebug + phpMyAdmin。埠段 8080 / 3000 / 3306 / 8891。
#
# vendor 與 node_modules 用**具名 volume 蓋回去**，這是舊 compose 的 D6：
# ./backend:/var/www/html 會把 image 裡烘好的 vendor 整個遮掉，
# 容器在 entrypoint 就 `Failed opening required 'vendor/autoload.php'`。
# 具名 volume 掛在「image 中已存在的路徑」上時，Docker 會用 image 內容種子化它，
# 所以掛上去反而救回 vendor。（掛在 image 中不存在的路徑才會變成 root:root 空目錄。）

services:

  mysql:
    pids_limit: 512
    ports:
      # 只綁 loopback。0.0.0.0 會把資料庫曝在區網上。
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"

  app:
    # dev 會跑 composer install / npm ci / xdebug，fork 數與記憶體都會尖峰。
    # 所以只設 pids 且給寬，**不設 mem_limit** —— dev 的 OOM kill 表現是
    # 「容器隨機重啟」，那會浪費好幾小時去查錯的方向。
    pids_limit: 1024
    volumes:
      - ./backend:/var/www/html
      - app-vendor:/var/www/html/vendor
    extra_hosts:
      # xdebug 要連回 host 的 IDE。Linux/WSL 上這個名字不會自動存在。
      - "host.docker.internal:host-gateway"

  nuxt:
    # node 不會回收孤兒行程（PID 1 的責任）。entrypoint 已經改成直接 exec nuxt
    # 而不是 exec npm（npm 不轉發 SIGTERM），init: true 是第二道保險。
    # **不加在 app** —— supervisord 本身就是一個正經的 init，多一層 tini
    # 只會讓 supervisorctl 對 PID 的預期錯亂。
    init: true
    pids_limit: 1024
    ports:
      # dev 額外把 Nuxt 直接曝出來，方便繞過 edge debug HMR。
      - "${NUXT_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - nuxt-node-modules:/app/node_modules
      - nuxt-build:/app/.nuxt
      - nuxt-output:/app/.output
    environment:
      CHOKIDAR_USEPOLLING: "true"

  edge:
    pids_limit: 256
    ports:
      - "${EDGE_HTTP_PORT:-8080}:8080"

  # dev 專屬。test/prod 沒有這個 service（D13：正式環境不發布管理工具）。
  phpmyadmin:
    pids_limit: 256
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin:5}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # 官方 phpmyadmin 映像以 root 起 apache 再降權。綁的是 80（容器內），
    # 但那是**容器內**的埠，host 端由 docker-proxy 發布，所以不需要
    # NET_BIND_SERVICE —— 容器內的 80 < 1024，這裡確實需要。
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, NET_BIND_SERVICE]
    stop_grace_period: 15s
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:?根目錄 .env 缺少 MYSQL_ROOT_PASSWORD（跑 cx setup）}
      UPLOAD_LIMIT: 64M
    ports:
      - "${MYSQL_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-8891}:80"
    depends_on:
      mysql:
        condition: service_healthy
    # 這個 service 原本是全專案唯一沒有 healthcheck 的一個，於是
    # `cx dev ps` 只會說 Up —— 容器活著但 PHP 起不來（例如 PMA_HOST 打錯）
    # 的狀態完全看不出來。映像基於 Alpine，有 wget、沒有 curl。
    # ⚠ 用 curl 不用 wget。phpmyadmin:5 是 Debian 基底，**沒有 wget**
    # —— 這與 docker-verification.md 3.10 記的 SonarQube 是同一個坑：
    # healthcheck 用了映像裡不存在的工具，容器會永遠 unhealthy，
    # 而 `docker inspect` 之外看不到原因，任何 condition: service_healthy
    # 的依賴都會卡死。實測輸出是 `/bin/sh: 1: wget: not found`。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app_net]

volumes:
  app-vendor:
  nuxt-node-modules:
  nuxt-build:
  nuxt-output:

# ── test overlay ────────────────────────────────────────────────────────────
# 不可變映像（原始碼烘進 image，沒有任何原始碼 bind mount）+ ModSecurity WAF。
# 埠段 18080 / 18081 / 13000 / 13306。
#
# 這個模式的對外入口是 waf，不是 edge：
#   ZAP → waf:8080 (ModSecurity + CRS) → edge:8080 → app / nuxt
# cx scan dast 會用 MODSEC_RULE_ENGINE=DetectionOnly 與 On 各跑一次
#（每輪之前真的重建 waf 容器），跑完還原成本檔案宣告的值。
# ⚠ 兩份 alert 的差集**不是**攔截率 —— zap-baseline 是被動掃描，相減永遠是 0。
# 攔截率由 bin/lib/waf_probe.py 的主動探測量，見 docker/security/zap/README.md。

services:

  mysql:
    pids_limit: 512
    mem_limit: 1g
    ports:
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-13306}:3306"

  app:
    pids_limit: 512
    mem_limit: 1g
    # 原始碼在 image 裡，只有 storage 需要可寫 → 具名 volume。
    # 掛在 image 已存在的路徑上，所以會被 image 的 storage 骨架種子化
    # （framework/cache、framework/sessions、framework/views、logs）。
    volumes:
      - app-storage:/var/www/html/storage

  nuxt:
    pids_limit: 256
    mem_limit: 512m
    ports:
      - "${NUXT_PORT:-13000}:3000"

  edge:
    pids_limit: 256
    mem_limit: 128m
    ports:
      # edge 仍然發布，方便對照「有沒有經過 WAF」的差異。
      - "${EDGE_HTTP_PORT:-18080}:8080"

  # test 也要有 phpMyAdmin —— 這個模式是「開發測試與 DevSecOps 專用」，
  # 掃描跑出問題時要能立刻翻資料庫對帳。埠 18891 一直都預留在
  # docker/env/test.env 裡，只是 service 從來沒被寫出來。
  #
  # 只綁 127.0.0.1，而且**不掛在 waf 後面** —— WAF 前門是 ZAP 的掃描目標，
  # 多掛一個管理介面進去只會讓 DAST 報告混進一堆 phpMyAdmin 自己的 alert。
  # prod 仍然完全沒有這個 service（D13），verify_checks 的 check_prod_closed
  # 會繼續盯著。
  phpmyadmin:
    pids_limit: 256
    mem_limit: 256m
    image: ${PHPMYADMIN_IMAGE:-phpmyadmin:5}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # 官方 phpmyadmin 映像以 root 起 apache 再降權。綁的是 80（容器內），
    # 但那是**容器內**的埠，host 端由 docker-proxy 發布，所以不需要
    # NET_BIND_SERVICE —— 容器內的 80 < 1024，這裡確實需要。
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, NET_BIND_SERVICE]
    stop_grace_period: 15s
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:?根目錄 .env 缺少 MYSQL_ROOT_PASSWORD（跑 cx setup）}
      UPLOAD_LIMIT: 64M
    ports:
      - "${MYSQL_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-18891}:80"
    depends_on:
      mysql:
        condition: service_healthy
    # ⚠ 用 curl 不用 wget。phpmyadmin:5 是 Debian 基底，**沒有 wget**
    # —— 這與 docker-verification.md 3.10 記的 SonarQube 是同一個坑：
    # healthcheck 用了映像裡不存在的工具，容器會永遠 unhealthy，
    # 而 `docker inspect` 之外看不到原因，任何 condition: service_healthy
    # 的依賴都會卡死。實測輸出是 `/bin/sh: 1: wget: not found`。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app_net]

  # ── ModSecurity + OWASP CRS 反向代理 ──────────────────────────────────────
  waf:
    # ModSecurity 的請求 body 緩衝是 MODSEC_REQ_BODY_LIMIT（約 12.5MB）/請求
    pids_limit: 256
    mem_limit: 512m
    image: ${WAF_IMAGE:-owasp/modsecurity-crs:nginx-alpine}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # 映像的 entrypoint 會重寫 /etc/nginx 與 /etc/modsecurity.d 的樣板，
    # 然後把 worker 降權。綁的是 8080。
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    environment:
      # CRS 的 nginx 形態是反向代理，必須給 BACKEND。
      BACKEND: http://edge:8080
      PORT: "8080"
      SERVER_NAME: localhost
      MODSEC_RULE_ENGINE: ${MODSEC_RULE_ENGINE:-DetectionOnly}
      # audit 預設 SecAuditLogType Serial 只寫 stdout。
      # 指定成 /dev/stdout 才拿得到資料 —— 掛一顆 volume 給
      # MODSEC_AUDIT_STORAGE_DIR 的話那顆 volume 會是空的，
      # WAF↔ZAP 對照完全沒有素材。取法：cx --mode test logs waf | grep '^{'
      MODSEC_AUDIT_ENGINE: RelevantOnly
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG_TYPE: Serial
      MODSEC_REQ_BODY_ACCESS: "On"
      MODSEC_RESP_BODY_ACCESS: "On"
      MODSEC_REQ_BODY_LIMIT: "13107200"
      PARANOIA: ${MODSEC_PARANOIA:-1}
      ANOMALY_INBOUND: ${MODSEC_ANOMALY_INBOUND:-5}
      ANOMALY_OUTBOUND: ${MODSEC_ANOMALY_OUTBOUND:-4}
    volumes:
      # ⚠ 掛載點是實測出來的，不是照文件猜的。
      #
      # 映像的 /etc/modsecurity.d/setup.conf 載入順序：
      #   modsecurity.conf
      #   modsecurity-override.conf        ← entrypoint 自己產生，不可掛成唯讀
      #   owasp-crs/crs-setup.conf
      #   owasp-crs/plugins/*-config.conf
      #   owasp-crs/plugins/*-before.conf  ← exclusions-before 掛這裡
      #   owasp-crs/rules/*.conf           ← CRS 本體
      #   owasp-crs/plugins/*-after.conf   ← exclusions-after 掛這裡
      #
      # 那三行 plugins 的 Include 在映像裡預設是註解掉的，
      # /docker-entrypoint.d/94-activate-plugins.sh 會在偵測到對應檔案存在時
      # 用 sed 取消註解 —— 所以檔名結尾必須正好是 -before.conf / -after.conf。
      #
      # 一開始掛在 modsecurity-override.conf 是錯的：
      # 90-copy-modsecurity-config.sh 會 touch 並覆寫那個檔，掛成 :ro 之後
      # 它 exit 1，容器陷入 Restarting 迴圈而且 nginx 完全沒起來。
      #
      # ctl:ruleRemoveById 只影響「同 phase 中尚未執行」的規則，
      # 所以 exclusions-before 一定要在 CRS 規則之前載入，載在之後等於沒寫。
      - ./docker/waf/exclusions-before/pm-exclusions-before.conf:/opt/owasp-crs/plugins/pm-exclusions-before.conf:ro
      - ./docker/waf/exclusions-after/pm-exclusions-after.conf:/opt/owasp-crs/plugins/pm-exclusions-after.conf:ro
      # CRS 映像的 includes/proxy_backend.conf 寫死 X-Forwarded-Port $server_port，
      # 那是 WAF 自己的 8080，不是使用者連進來的 18081。覆蓋它。
      #
      # ⚠ 必須掛成 **template**，不能直接掛到 /etc/nginx/includes/。
      # 映像的 20-envsubst-on-templates.sh 會把 templates/ 底下每一個檔案
      # 展開寫進對應位置；把目標檔掛成 :ro 會讓那個腳本整個失敗
      #（實測錯誤是 "can't create /etc/nginx/includes/cors.conf: Permission denied"，
      #  指向的是另一個檔案，非常難聯想到是自己的掛載造成的），
      # 容器接著陷入 Restarting 迴圈。
      #
      # envsubst 只會替換「環境變數裡真的存在」的名字，
      # 所以 $host / $scheme / $pm_forwarded_port 這些 nginx 變數會原樣保留。
      - ./docker/waf/proxy_backend.conf:/etc/nginx/templates/includes/proxy_backend.conf.template:ro
      - ./docker/waf/pm-forwarded-port.conf:/etc/nginx/templates/conf.d/pm-forwarded-port.conf.template:ro
    ports:
      - "${WAF_HTTP_PORT:-18081}:8080"
    depends_on:
      edge:
        condition: service_healthy
    healthcheck:
      # CRS 映像沒有 curl，但有 busybox 的 wget。
      # 打 / 而不是 /healthz —— WAF 只是代理，healthz 是 edge 的端點，
      # 經過 WAF 轉發後 200 就代表整條鏈路通了。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [app_net]

volumes:
  app-storage:

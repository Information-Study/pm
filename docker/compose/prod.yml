# ── prod overlay ────────────────────────────────────────────────────────────
# 只發布 80。無 phpMyAdmin、無 MySQL 埠、無掃描器、無 xdebug（build 時斷言）。
#
# 刻意**不發布 8443**：這裡的 edge 沒有 listen ssl 區塊。
# 發布了卻沒有 TLS，配上 SESSION_SECURE_COOKIE=true 會讓 Filament 登入
# 陷入無限 419（cookie 只在 https 送出，CSRF token 永遠對不上）。
# 正式環境的 TLS 走 Ansible 那條路（certbot + MyGuard nginx，claude.md §6）。

services:

  # prod 不發布資料庫埠 —— 這裡沒有 ports:，且 base 也沒有（base 禁 ports）。
  mysql:
    restart: always

  app:
    restart: always
    volumes:
      - app-storage:/var/www/html/storage

  nuxt:
    restart: always
    # 不發布 3000。對外只有 edge 的 80。

  edge:
    restart: always
    ports:
      - "${EDGE_HTTP_PORT:-80}:8080"

volumes:
  app-storage:

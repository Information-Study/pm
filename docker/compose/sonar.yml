# ── SonarQube 常駐 stack ────────────────────────────────────────────────────
# 獨立 compose project（cx sonar up 用 -p pm_devsecops），dev / test 共用。
# 網路名明寫 pm_devsecops_net，因為 sonar-scanner 是短暫容器，
# 要用 `docker run --network pm_devsecops_net` 加進來才解析得到 http://sonarqube:9000
#（傳 localhost 進容器指的是容器自己）。

services:

  sonarqube:
    image: ${SONARQUBE_IMAGE:-sonarqube:2026-lta-community}
    restart: unless-stopped
    depends_on:
      sonardb:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonardb:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # 2026.1+ 需要 /tmp 可讀寫。
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-logs:/opt/sonarqube/logs
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-tmp:/opt/sonarqube/temp
    ports:
      - "${SONAR_PORT:-9000}:9000"
    # ⚠ 必須用 curl，**不能用 wget**。這個映像基於 eclipse-temurin:25-jdk-noble，
    # 只裝了 bash / curl / fonts-dejavu，沒有 wget。
    # 寫成 wget 會永遠 unhealthy，任何 condition: service_healthy 依賴都會死鎖。
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    networks: [devsecops_net]

  sonardb:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - sonar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [devsecops_net]

volumes:
  sonar-data:
  sonar-logs:
  sonar-extensions:
  sonar-tmp:
  sonar-db:

networks:
  devsecops_net:
    name: pm_devsecops_net

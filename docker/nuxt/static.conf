# static 模式的 nginx vhost。監聽 3000，讓 edge 的設定與 ssr/spa 模式完全一致。
server {
    listen 3000 default_server;
    listen [::]:3000 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # nuxt generate 的產出是預先渲染的 .html，找不到就退回 200.html（Nuxt 的 SPA fallback）。
    location / {
        try_files $uri $uri/index.html $uri.html /200.html =404;
    }

    # _nuxt/ 底下都是含 hash 的檔名，可以放心長快取。
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

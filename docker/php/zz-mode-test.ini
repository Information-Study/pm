; test：介於 dev 與 prod 之間，但錯誤顯示這一項要跟 prod 一致。
;
; 為什麼不能沿用 zz-mode-dev.ini（2026-09-05 之前就是這樣）：
; test 正是被 ZAP 掃、被 ModSecurity 擋的那個模式。display_errors = On
; 會讓 PHP 層的錯誤直接寫進 HTTP 回應 —— 路徑、行號、堆疊全部外洩到
; DAST 的攻擊面上。APP_DEBUG=false 只擋得住 Laravel 的除錯頁，
; 擋不住 PHP 自己的 fatal error 輸出。
;
; 掃描結果要能代表 prod，受測物的錯誤行為就得跟 prod 一樣。
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL

; opcache 則沿用 dev 的設定：test 映像雖然不可變，但 cx test back /
; cx test coverage 會在容器裡跑 PHPUnit，validate_timestamps=0 會讓
; 臨時寫入的設定檔（例如覆蓋率用的 xdebug ini）不生效。
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; save_comments 不能關 —— Filament 與 Laravel 大量使用 attribute/annotation 反射。
opcache.save_comments = 1

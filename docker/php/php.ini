; ── 三個模式共用的 PHP 設定 ────────────────────────────────────────────────
; 模式差異（opcache 是否驗證時間戳、display_errors）在 zz-mode-*.ini。
memory_limit = 512M
max_execution_time = 120
post_max_size = 64M
upload_max_filesize = 32M
max_file_uploads = 40
max_input_vars = 5000

; upload_max_filesize <= post_max_size <= nginx client_max_body_size，
; 三者必須單調不遞減，否則大檔上傳會在其中一層被截斷且訊息互相矛盾。

date.timezone = Asia/Taipei
expose_php = Off

log_errors = On
error_log = /dev/stderr

; realpath cache：Laravel 的 include 路徑很多，預設 16k 太小。
realpath_cache_size = 4096k
realpath_cache_ttl = 600

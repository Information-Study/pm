; ── supervisord：app 容器的 PID 1 ───────────────────────────────────────────
;
; 舊版最嚴重的缺陷（D5）在這裡修掉：
;   CMD ["sh","-c","php-fpm -D && nginx -g 'daemon off;'", "supervisord -c ..."]
; 陣列的第 4 個元素會變成 `sh -c` 的 $0，**supervisord 從未啟動** ——
; 也就是說 queue worker 從來沒跑過，而且沒有任何錯誤訊息。
;
; 現在四個程式全部由 supervisord 管，且全部把 log 導到 stdout/stderr，
; 這樣 `cx logs app` 才看得到東西（寫檔的話 docker logs 是空的）。
;
; 驗收：docker compose ... exec app supervisorctl status
;       應該看到 nginx / php-fpm / laravel-queue / laravel-schedule 四個 RUNNING。

[supervisord]
nodaemon = true
user = root
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /var/run/supervisord.pid
loglevel = info

[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; supervisorctl 需要這一段才能連上 socket。少了它
; `exec app supervisorctl status` 會回 "unix:///var/run/supervisor.sock refused connection"。
[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

; 舊映像的 supervisord.conf 有 `files = /etc/supervisor/conf.d/*.conf`，
; laravel-queue.conf 就是靠它掛進來的（COPY 到 conf.d/）。
; 新映像把 program 直接寫進本檔之後，這個 drop-in 目錄跟著不見了 ——
; 於是「加一個額外的 worker」變成必須改這個烤進映像的檔案再重建。
; 補回來：目錄由 Dockerfile 建立（空的也沒關係，glob 不匹配不會出錯），
; 之後就能用 bind mount 或衍生映像丟一個 .conf 進去加 program。
[include]
files = /etc/supervisor/conf.d/*.conf

[program:php-fpm]
command = php-fpm --nodaemonize --force-stderr
autostart = true
autorestart = true
priority = 10
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; php-fpm 掛掉就整個容器重啟，不要讓 nginx 對著死掉的 fastcgi 回 502。
exitcodes = 0
stopsignal = QUIT

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
priority = 20
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
stopsignal = QUIT

[program:laravel-queue]
; --queue 刻意留預設。舊版寫死 --queue=media-library 是前一個專案的殘留，
; 本專案沒有那個 queue，worker 會空轉。
command = php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
directory = /var/www/html
user = www-data
numprocs = 2
process_name = %(program_name)s_%(process_num)02d
autostart = true
autorestart = true
priority = 30
; --max-time=3600 讓 worker 每小時自己退出，由 supervisord 拉起來 ——
; 這是 Laravel 官方建議的作法，避免長命 worker 抱著舊的 code 與洩漏的記憶體。
; 30 而不是 100。
;
; Docker 的預設 stop_grace_period 是 10 秒，所以 100 這個值從來沒有真正生效過
; —— 處理中的 job 一律在 t+10s 被 SIGKILL。兩個數字**直接矛盾**。
;
; 對齊的方向是把它降到 30、並把 compose 的 stop_grace_period 設成 45，
; 而不是把 grace 拉到 120：120 秒的停機會讓 cx dev down 與
; cx test up -d --build 慢到讓人改用 docker kill，那嚴格更糟。
; 超過 30 秒的 job 會被重試 —— queue:work --tries=3 本來就處理這件事。
;
; 這兩個數字的關係由 cx verify static 的 check_stop_semantics 跨檔盯著。
stopwaitsecs = 30
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:laravel-schedule]
; artisan schedule:work 內建每分鐘一次的迴圈，比在容器裡塞 cron 乾淨。
command = php /var/www/html/artisan schedule:work
directory = /var/www/html
user = www-data
autostart = true
autorestart = true
priority = 40
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

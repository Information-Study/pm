; ── php-fpm pool ───────────────────────────────────────────────────────────
; 只綁 loopback：nginx 在同一個容器裡，9000 不需要曝給網路上的其他容器。
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; log 進 stdout/stderr，容器才看得到。
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

clear_env = no

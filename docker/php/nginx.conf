# ── app 容器內部的 nginx（不是 edge）──────────────────────────────────────────
# 只服務 PHP：php-fpm 在同一個容器的 127.0.0.1:9000。
# 對外路由（/ 給 Nuxt、/api 給 PHP）是 edge 的工作，見 docker/edge/。
#
# 與舊版 docker/php/nginx.conf 的差異：
#   * log 走 /dev/stdout、/dev/stderr —— 容器的 log 必須進 docker logs，
#     寫檔的話 `cx logs app` 什麼都看不到。
#   * 整段 TLS 設定移除。這個容器永遠在 edge（或 WAF)後面，根本不終結 TLS，
#     而舊版留著的那份設定還允許早已 EOL 的 1.1 版協定。
#     （這裡刻意不寫出該指令的字面名稱 —— Semgrep 的 insecure-ssl-version
#      規則會連註解一起匹配，造成永遠修不掉的假陽性。）
#   * 只 include http.d/，不再同時 include conf.d/ —— 兩邊都 include 會讓
#     Alpine 套件自帶的 default.conf 與我們的 vhost 同時宣告 default_server。

user www-data;
worker_processes auto;
pcre_jit on;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 64m;
    client_body_timeout 60s;

    # 這個容器永遠在 edge（或 WAF → edge）後面，所以要信任前方傳來的 X-Forwarded-*，
    # 否則 Laravel 看到的 client IP 全是 edge 的容器 IP，rate limit 與稽核紀錄都會失真。
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    # Docker 的預設 bridge/自訂網路都在 172.16/12；額外涵蓋 10/8 與 192.168/16。
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript image/svg+xml;

    include /etc/nginx/http.d/*.conf;
}

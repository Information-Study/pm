# ── CRS 排除規則：在 CRS 規則之前載入 ───────────────────────────────────────
#
# 掛載點：/etc/modsecurity.d/owasp-crs/plugins/pm-exclusions-before.conf
# owasp/modsecurity-crs 映像的 setup.conf 載入順序是
#   modsecurity.conf → crs-setup.conf → plugins/*-config.conf
#   → plugins/*-before.conf → rules/*.conf → plugins/*-after.conf
#   → modsecurity-override.conf
# 這個檔用 -before.conf 結尾，所以會在 CRS 規則之前執行。
#
# 這份內容與 ansible/roles/nginx_myguard 的 waf_exclusions_before 是同一組規則
# （Docker 與原生部署刻意保持相同的 WAF 行為）。改一邊就要改另一邊。
#
# 兩個致命細節：
#
#  1. ctl:ruleRemoveById 只影響「同一個 phase 中尚未執行」的規則。
#     920xxx（協定強制）是 phase 1，941/942xxx（XSS/SQLi）是 phase 2。
#     用一條 phase:2 的規則去移除 920273 完全無效 —— 那條規則早就跑完了。
#     所以下面刻意拆成 phase:1 與 phase:2 兩組。
#
#  2. 多個 ctl: 之間是逗號，不是分號。
#     分號會讓 ModSecurity 拒絕載入整份設定、nginx 以 emerg 起不來，
#     而錯誤訊息只會說 "Rules error"，看不出是哪個字元的問題。

# --- 10010（phase 1）---
# Livewire v4（Filament v5 的底層）。/update 送的是整個元件狀態的
# JSON 快照，裡面常有 CRS 認定為「協定異常」的字元。
#
# ⚠ 不能寫 "@beginsWith /livewire/"。Livewire v4 的端點前綴由 APP_KEY 推導：
#     EndpointResolver::prefix() = '/livewire-' . substr(sha256(app.key.'livewire-endpoint'), 0, 8)
#   實測 route:list 得到 /livewire-cda13245/update —— 每個部署、每個模式都不同，
#   key:generate 之後還會變，所以既不能寫死也不能用 /livewire/ 前綴比對。
#   比對不到的後果不是「規則沒生效」這麼溫和：ruleEngine=On 之下，
#   後台的每一次互動都會被 941/942 擋成 403，而且 audit log 只會指向 CRS 規則，
#   不會有任何線索說「你的排除規則路徑寫錯了」。
#   docker/edge/conf.d/default.conf 早在 2026-09-04 就修過同一個坑（location 那邊），
#   這裡與 ansible 的 nginx_myguard 當時漏掉了。
#   @rx 同時吃帶 hash 與不帶 hash 兩種形式。
SecRule REQUEST_URI "@rx ^/livewire(-[0-9a-zA-Z]+)?/" \
    "id:10010,phase:1,pass,nolog,ctl:ruleRemoveById=920273,ctl:ruleRemoveById=920274"

# --- 10011（phase 2）---
# Livewire —— 941 XSS / 942 SQLi 的誤判。前綴形狀同 10010。
SecRule REQUEST_URI "@rx ^/livewire(-[0-9a-zA-Z]+)?/" \
    "id:10011,phase:2,pass,nolog,ctl:ruleRemoveById=941100,ctl:ruleRemoveById=941110,ctl:ruleRemoveById=941160,ctl:ruleRemoveById=942100,ctl:ruleRemoveById=942190,ctl:ruleRemoveById=942260,ctl:ruleRemoveById=942270,ctl:ruleRemoveById=942430,ctl:ruleRemoveById=942440"

# --- 10012（phase 1）---
# Filament 後台 /admin。
SecRule REQUEST_URI "@beginsWith /admin" \
    "id:10012,phase:1,pass,nolog,ctl:ruleRemoveById=920273"

# --- 10013（phase 2）---
# Filament 後台 /admin。富文字欄位與表格篩選器送出的內容幾乎必定會踩到 941/942。
SecRule REQUEST_URI "@beginsWith /admin" \
    "id:10013,phase:2,pass,nolog,ctl:ruleRemoveById=941100,ctl:ruleRemoveById=941160,ctl:ruleRemoveById=942100,ctl:ruleRemoveById=942270,ctl:ruleRemoveById=942430,ctl:ruleRemoveById=942440"

# --- 10014（phase 1）---
# Laravel 的健康檢查端點（bootstrap/app.php 的 health: /up）。
# 監控系統的 User-Agent 常被 913xxx 當成掃描器。
SecRule REQUEST_URI "@streq /up" \
    "id:10014,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"

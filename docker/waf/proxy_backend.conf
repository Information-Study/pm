# 覆蓋 owasp/modsecurity-crs 的 /etc/nginx/includes/proxy_backend.conf。
#
# 只改一行：X-Forwarded-Port 從 $server_port 改成 $pm_forwarded_port
#（由 conf.d/pm-forwarded-port.conf 的 map 從 Host 標頭解析出來）。
# 其餘與映像原版逐字相同 —— 這個檔是整份取代，不是疊加，
# 少寫任何一行都會讓 WAF 的反向代理行為改變。
#
# 原版的問題：$server_port 是 WAF 自己監聽的 8080，不是使用者連的 18081，
# 於是 Laravel 產生的絕對網址與 302 全部指向一個不對的埠。
proxy_set_header Host $host;
proxy_set_header Proxy "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header X-REAL-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Port $pm_forwarded_port;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_http_version 1.1;
proxy_buffering off;
proxy_connect_timeout 60s;
proxy_read_timeout 36000s;
proxy_redirect off;

proxy_pass_header Authorization;
proxy_pass http://edge:8080;

set_real_ip_from 127.0.0.1;

real_ip_header X-REAL-IP;
real_ip_recursive on;

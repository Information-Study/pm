# ── CRS 之後才能執行的調整 ──────────────────────────────────────────────────
#
# 掛載點：/etc/modsecurity.d/modsecurity-override.conf
# 那是映像 setup.conf 的最後一個 Include，也就是 CRS 規則全部載入之後。
#
# 為什麼一定要在後面：SecRuleUpdateTargetById 是**載入期**指令，
# 它去修改一條「已經存在」的規則。放在 CRS 之前只會得到
# 「規則不存在」的載入錯誤，nginx 直接 emerg 起不來。
#
# ⚠ 預設刻意留空。引用一個 CRS 裡不存在的規則 ID（版本差異、上游移除規則）
#   同樣會在載入期就報錯。正確流程是：
#     1. cx test up            （MODSEC_RULE_ENGINE=DetectionOnly）
#     2. cx scan dast          （收 audit log）
#     3. cx logs waf | grep '^{' | ...   找出真正誤判的規則 ID
#     4. 才把對應的 SecRuleUpdateTargetById 寫進這個檔
#
#   憑空猜規則 ID 會把 WAF 弄成起不來，而且症狀是「整個 test 模式都起不來」，
#   看起來完全不像 WAF 的問題。
#
# 格式範例（多個 target 之間用「|」，不是逗號也不是分號）：
#
#   # Laravel 的 CSRF token 與 session cookie 裡本來就會出現 -- 序列
#   SecRuleUpdateTargetById 942440 "!ARGS:_token|!REQUEST_COOKIES:/^(XSRF-TOKEN|laravel_session)$/"

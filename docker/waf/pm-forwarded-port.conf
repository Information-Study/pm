# 掛到 WAF 容器的 /etc/nginx/conf.d/pm-forwarded-port.conf（http 層）。
#
# owasp/modsecurity-crs 的 includes/proxy_backend.conf 寫死
#   proxy_set_header X-Forwarded-Port $server_port;
# 而 $server_port 是 WAF 自己監聽的埠（8080），不是使用者連進來的埠（18081）。
# 於是 Laravel 產生的絕對網址與 302 全部指向 http://localhost:8080/…
#
# 2026-09-04 實測：從 18081 打 /admin，302 指向 8080。
# ZAP 在掃描時會跟著這些連結走，結果打到一個不存在的埠上，
# 掃描覆蓋率會無聲地變差 —— 而報告上不會有任何跡象說明原因。
#
# 這個 map 與 edge 的那一份是同一套邏輯（docker/edge/nginx.conf）。
map $scheme $pm_scheme_port {
    default  80;
    https    443;
}

map $http_host $pm_forwarded_port {
    default                     $pm_scheme_port;
    "~^[^:]+:(?<pm_hp>[0-9]+)$" $pm_hp;
}

sonar.projectKey=pm
sonar.projectName=pm
sonar.projectVersion=0.1.0

# ⚠ sonar.sources / sonar.tests 只能列「實際存在」的目錄。
#   路徑不存在是 scanner 的 ERROR 中止，不是 warning，
#   但看起來會很像 Quality Gate 失敗，其實根本沒分析。
sonar.sources=backend/app,backend/config,backend/database,backend/routes,frontend/app
sonar.tests=backend/tests

sonar.exclusions=**/vendor/**,**/node_modules/**,**/.nuxt/**,**/.output/**,**/public/build/**,**/storage/**,**/bootstrap/cache/**,**/*.min.js
sonar.test.exclusions=**/vendor/**,**/node_modules/**

sonar.php.coverage.reportPaths=reports/quality/coverage-backend.xml
sonar.php.tests.reportPath=reports/quality/junit-backend.xml
sonar.javascript.lcov.reportPaths=reports/quality/coverage-frontend/lcov.info

sonar.sourceEncoding=UTF-8
